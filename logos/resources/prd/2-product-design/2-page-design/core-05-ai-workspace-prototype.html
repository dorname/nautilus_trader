'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),copy=x=>JSON.parse(JSON.stringify(x)),money=x=>Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pages={requirements:['需求','把研究想法写成可验证、可追溯的需求文档'],design:['设计','处理逻辑自动生成流程图与时序图，先看清系统再动手'],develop:['开发','编辑策略草稿，保存不可变版本'],debug:['调试','沿事件轨迹回答"为什么"——正确性验证的手段'],validate:['验证','回测回答历史表现，验证综合调试与回测下结论'],plan:['交易计划','对已验证版本做最新时点的前向核对，导出人工参考清单']};
const nodes=[['data','读取数据','行情与可见时间',3],['filter','股票池过滤','成交额与示例信号',5],['signal','形成信号','收盘后生成目标',7],['size','计算仓位','数量与资金约束',10],['fill','模拟成交','订单与拒绝原因',13],['metric','计算指标','现金与期末净值',15]];
const roles=[['需求 Agent','确认规格'],['数据 Agent','样本与可见时间'],['研究 Agent','假设与失效条件'],['流程 Agent','处理图与节点契约'],['开发 Agent','代码草稿与参数'],['审查 Agent','检查清单与修复建议']];
const source=variant=>`# 研究策略代码示意；由预置模拟器映射，不执行 Python\ndef generate_targets(history, parameters, execution, simulation):\n    data = history.visible_at("2026-01-05 15:00")\n    # 仅使用信号日已知数据\n    pool = data.filter(amount_min=parameters["amount_min"])\n    # 示例：仅 SYN-A 满足量价信号\n    signal = pool.match("SYN-A")\n    cash = 10000\n    budget = cash * parameters["allocation"]\n    quantity = int(${variant===1?'budget / signal.close':'max(0, budget - 5) / execution.open'} / 100) * 100\n    # 下一交易日开盘；固定演示费用 5 元\n    # v${variant}：${variant===1?'旧逻辑，未检查跳空与费用':'修复，在成交阶段校验可买数量'}\n    fill = simulation.buy(quantity, fee=5)\n    # 结果来自成交及账户事件\n    return simulation.mark_to_market(fill)\n`;
const checkItems=[['look','无前视时点','信号仅使用信号日 15:00 前可见数据；依据：调试事件的可见时点逐条可查'],['cost','成本与跳空已建模','次日开盘价与 5 元固定费用进入成交计算；依据：成交事件的输入输出'],['reject','拒绝原因已定位','所有拒绝事件均查明原因（仓位参考价 / 资金约束），无未解释行为'],['bound','样本边界已声明','3 日合成样本只验证流程正确性，不能论证盈利能力；结论不外推']];
const state={page:Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'requirements',req:null,reqVersions:[],reqText:'研究 A股日线量价信号。收盘后筛选流动性充足的股票，下一交易日执行，先检查资金与费用约束，再比较修复前后结果。仅研究，不自动下单。',acceptance:'定位订单拒绝原因并保存修复版本；修复前后两次实验可比较；验证通过后导出人工交易计划；全程不自动下单。',draftAllocation:100,draftAmount:1000,flow:null,reqCount:0,flowCount:0,agentStatus:roles.map(()=> '待执行'),artifacts:[],selectedAgent:0,agentReq:0,agentRun:0,agentTimer:null,busy:false,budget:6,used:0,selectedNode:'size',designNote:'',draftCode:source(1),checked:null,versions:[],activeVersion:null,runs:[],selectedRun:0,eventIndex:0,filters:{date:'',symbol:'',node:''},playTimer:null,validations:{},valVer:null,planCash:10000,planHoldings:{'SYN-A':0,'SYN-B':0,'SYN-C':0},planResult:null,planExported:false,logs:['工程台就绪 · 从维护需求文档开始完整研究旅程'],error:''};
function log(s){state.logs.push(new Date().toLocaleTimeString('zh-CN')+'  '+s);$('#logs').innerHTML=state.logs.slice(-3).map(x=>'<div>'+esc(x)+'</div>').join('')}
function toast(s){$('#notice').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#notice').textContent='',3500)}
function modal(t,v){$('#dialogTitle').textContent=t;$('#dialogBody').textContent=v;$('#dialog').showModal()}
function go(p){stopPlay();state.page=p;location.hash=p;state.error='';render()}
function current(){return state.req&&state.flow&&state.flow.req===state.req.id&&state.agentReq===state.req.id&&state.agentStatus.every(x=>x==='已完成')}
function conclusionOf(id){const c=state.validations[id];if(!c)return '未结论';const vals=checkItems.map(([k])=>c[k]||'未评');if(vals.some(x=>x==='存疑'))return '存疑';if(vals.every(x=>x==='通过'))return '通过';return '未结论'}
function validatedVersions(){return state.versions.filter(v=>conclusionOf(v.id)==='通过')}
function stamps(){const c=state.activeVersion?conclusionOf(state.activeVersion.id):'—';return `<span class="tag">需求 ${state.req?'R'+state.req.id:'未确认'}</span><span class="tag">流程 ${state.flow?'F'+state.flow.id:'待生成'}</span><span class="tag">代码 ${state.activeVersion?'v'+state.activeVersion.id:'草稿'}</span><span class="${c==='通过'?'badge':c==='存疑'?'warn badge':'tag'}">验证 ${c}</span>`}
function shell(title,desc,body,side){const dones=[!!state.req,current(),state.versions.length>0,state.runs.length>0,validatedVersions().length>0,state.planExported];return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><span class="badge">交互原型 · 演示数据</span></div><div class="stepbar">${['需求确认','协作与设计','版本保存','调试运行','验证通过','计划导出'].map((x,i)=>`<span class="${dones[i]?'done':''}">0${i+1} ${x}</span>`).join('')}</div><div class="workspace"><div class="stack">${body}</div><aside class="stack" style="align-content:start">${side||sideDefault()}</aside></div>`}
function sideDefault(){return `<div class="panel"><div class="panelhead"><h3>项目上下文</h3><span class="badge">可追溯</span></div><div class="pad"><div class="kv"><span>研究市场</span><span>A股 · 日线</span><span>数据快照</span><span>SYN-202601</span><span>计算方式</span><span>固定样本模拟器</span><span>模型连接</span><span>未接入 · 预设产物</span><span>项目状态</span><span>${!state.req?'等待确认需求':current()?'产物就绪':'等待协作更新'}</span></div><p class="note">源码与 Agent 为交互演示。行情为合成样本，实验由演示模拟器计算。</p></div></div><div class="panel"><div class="panelhead"><h3>研究产物</h3></div><div class="pad timeline"><div><strong>需求文档</strong><small>${state.req?'R'+state.req.id+' 已确认 · 共 '+state.reqVersions.length+' 版':'待确认结构化规格'}</small></div><div><strong>设计：流程图与时序图</strong><small>${state.flow?'F'+state.flow.id+' · 6 个处理节点':'等待协作生成'}</small></div><div><strong>不可变代码版本</strong><small>${state.versions.length} 个版本</small></div><div><strong>实验与事件证据</strong><small>${state.runs.length} 次实验 · 可导出</small></div><div><strong>交易计划</strong><small>${state.planExported?'已导出演示 CSV':'等待验证通过的版本'}</small></div></div></div>`}
function requirements(){const a=state.artifacts.findLast(x=>x.role===state.selectedAgent);const side=`<div class="panel"><div class="panelhead"><h3>Agent 协作记录</h3><span class="tag">预设演示</span></div><div class="pad"><div class="row"><label for="budget" style="font-size:12px">步骤预算</label><input style="width:70px" id="budget" type="number" min="1" max="6" value="${state.budget}" ${state.busy?'disabled':''}><button class="primary compact" id="startAgents" ${!state.req||state.busy?'disabled':''}>${state.used?'重新执行':'开始协作'}</button><button class="compact" id="cancelAgents" ${!state.busy?'disabled':''}>取消</button></div><p class="note">需求 → 数据 / 研究 → 流程 → 开发 → 审查。取消停止后续提交；重试使用当前需求版本。</p><div class="agentlist">${roles.map((r,i)=>`<button class="agentitem ${state.selectedAgent===i?'selected':''}" data-agent="${i}"><span class="dot ${state.agentStatus[i]==='执行中'?'run':state.agentStatus[i]==='已完成'?'done':''}"></span><span style="flex:1;text-align:left">${r[0]}<small style="display:block">${r[1]}</small></span><span class="${state.agentStatus[i]==='已完成'?'badge':'tag'}">${state.agentStatus[i]}</span></button>`).join('')}</div></div>${a?`<div class="pad" style="border-top:1px solid var(--line)"><h3>${roles[state.selectedAgent][0]} · 产物</h3><div class="kv"><span>输入版本</span><span>R${a.req}</span><span>状态</span><span>${a.req===state.req?.id?'当前版本':'已过期'}</span><span>提交时间</span><span>${esc(a.time)}</span></div><div class="artifact">${esc(a.text)}</div></div>`:'<div class="pad" style="border-top:1px solid var(--line)"><p class="note">开始协作后，点击角色查看其可见动作、依据与输出。</p></div>'}</div>${sideDefault()}`;return shell('需求 · 维护研究需求文档','需求正文、结构化参数与验收标准共同构成需求版本；上游变更使下游产物过期。',`<div class="panel"><div class="panelhead"><h2>需求文档</h2><span class="badge">01 / 工程起点</span></div><div class="pad"><div class="field"><label for="reqText">研究目标（正文）</label><textarea id="reqText">${esc(state.reqText)}</textarea></div><div class="field"><label for="reqAcc">验收标准</label><textarea id="reqAcc" style="min-height:70px">${esc(state.acceptance)}</textarea></div><div class="guide">原型不会自动解析任意文本；请确认下方结构化参数，它们才是下游流程图与模拟器的真实输入。</div><div class="cols"><div class="field"><label for="allocation">投入比例（%）</label><input id="allocation" type="number" min="1" max="100" value="${state.draftAllocation}"></div><div class="field"><label for="amount">最低成交额（万元）</label><input id="amount" type="number" min="0" max="10000" value="${state.draftAmount}"></div></div><div class="kv"><span>研究窗口</span><span>2026-01-05 → 2026-01-07</span><span>初始资金</span><span>10,000.00 元 · 合成样本3只</span><span>执行假设</span><span>收盘信号 → 次日开盘；100股单位，5元固定费用</span></div><p class="error" id="formError">${esc(state.error)}</p><div class="row" style="margin-top:18px"><button class="primary" id="confirmReq">确认规格并保存需求版本</button>${current()?'<button onclick="go(\'design\')">查看设计图 →</button>':''}</div></div></div><div class="panel"><div class="panelhead"><h2>需求版本</h2><span class="tag">${state.reqVersions.length} 个</span></div>${state.reqVersions.length?state.reqVersions.map(r=>`<div class="version"><div><b>R${r.id} ${state.req?.id===r.id?'· 当前':''}</b><br><small>${esc(r.text.slice(0,42))}… · ${esc(r.time)}</small></div><span class="${state.req?.id===r.id?'badge':'tag'}">${state.req?.id===r.id?'生效中':'历史'}</span></div>`).join(''):'<div class="pad muted">确认后在此形成版本历史；旧版本只读保留。</div>'}</div>`,side)}
function confirmReq(){const text=$('#reqText').value.trim(),acc=$('#reqAcc').value.trim(),allocation=Number($('#allocation').value),amount=Number($('#amount').value);state.reqText=text;state.acceptance=acc;state.draftAllocation=allocation;state.draftAmount=amount;if(!text||!acc||!Number.isFinite(allocation)||allocation<1||allocation>100||!Number.isFinite(amount)||amount<0||amount>10000){state.error='请填写需求正文与验收标准；投入比例1～100%，最低成交额0～10000万元。';render();return}cancelAgents(false);state.req={id:++state.reqCount,text,acceptance:acc,allocation:allocation/100,amount};state.reqVersions.push({id:state.req.id,text,time:new Date().toLocaleTimeString('zh-CN')});state.agentStatus=roles.map(()=> '已过期');state.checked=null;state.error='';log('确认需求 R'+state.req.id+' · 旧产物保留并标记过期');toast('需求 R'+state.req.id+' 已确认，可在右侧开始协作');render()}
function artifactText(i){const r=state.req;return [`读取：用户确认的 R${r.id}\n输出：日线信号；投入比例${r.allocation*100}%；最低成交额${r.amount}万元。\n验收：${r.acceptance}`,`读取：SYN-202601 合成快照\n输出：3只示例股票、3个交易日。\n依据：信号只使用2026-01-05收盘数据，次日开盘作为执行事件输入。`,`读取：R${r.id}与固定示例假设\n假设：SYN-A 满足量价条件。\n反例：跳空与交易费用会使满仓数量不可买。\n限制：小样本只能验证流程，不能论证盈利能力。`,`读取：数据与研究产物\n输出：读取→过滤→信号→仓位→成交→指标。\n参数：最低成交额${r.amount}万元；投入${r.allocation*100}%。`,`读取：流程节点定义\n输出：v1代码草稿与节点行号映射。\n注意：Python仅为展示；预置模拟器执行等价示例。`,`读取：代码草稿与资金约束\n检查：信号和成交不同日。\n待验证：v1可能以信号价格计算超额数量。\n建议：先跑基线，再按拒绝事件应用修复。`][i]}
function startAgents(){state.budget=Number($('#budget').value);if(!Number.isInteger(state.budget)||state.budget<1||state.budget>6){toast('步骤预算必须是1～6的整数');return}cancelAgents(false);state.agentReq=0;state.agentStatus=roles.map(()=> '待执行');state.used=0;state.busy=true;const token=++state.agentRun,layers=[[0],[1,2],[3],[4],[5]];let layer=0;log('协调器启动 · 输入 R'+state.req.id);function next(){if(token!==state.agentRun)return;const ids=layers[layer];if(state.used+ids.length>state.budget){state.busy=false;ids.forEach(i=>state.agentStatus[i]='预算不足');log('协作停止 · 当前依赖层预算不足，调整后重试');render();return}ids.forEach(i=>state.agentStatus[i]='执行中');render();state.agentTimer=setTimeout(()=>{if(token!==state.agentRun)return;ids.forEach(i=>{state.agentStatus[i]='已完成';state.used++;state.artifacts.push({role:i,req:state.req.id,time:new Date().toLocaleTimeString('zh-CN'),text:artifactText(i)});log(roles[i][0]+' 提交产物 · R'+state.req.id)});layer++;if(layer<layers.length)next();else{state.busy=false;state.agentReq=state.req.id;state.flow={id:++state.flowCount,req:state.req.id,amount:state.req.amount,allocation:state.req.allocation};state.draftCode=source(1);state.checked=null;state.activeVersion=null;log('协作完成 · 生成 F'+state.flow.id+' 与 v1 代码草稿');toast('设计产物已生成，进入「设计」查看流程图与时序图');render()}},650)}next()}
function cancelAgents(show=true){clearTimeout(state.agentTimer);state.agentRun++;if(state.busy){state.agentStatus=state.agentStatus.map(x=>x==='执行中'||x==='待执行'?'已取消':x);state.busy=false;log('协作已取消 · 不再提交后续产物')}if(show)render()}
function flowGraph(){return `<div class="graph flowgraph">${nodes.map((x,i)=>`${i===3?'<div class="wide muted" style="font-size:11px;text-align:center">信号形成后 → 下一交易日执行<svg viewBox="0 0 600 30" width="100%" height="30" aria-label="信号连接到仓位计算"><path d="M550 0 V12 H50 V25" fill="none" stroke="currentColor"/><path d="M45 20 L50 27 L55 20" fill="none" stroke="currentColor"/></svg></div>':''}<button class="node ${state.selectedNode===x[0]?'selected':''}" data-node="${x[0]}"><span class="tag">0${i+1}</span><br><b>${x[1]}</b><small>${x[2]}</small></button>${i%3!==2?'<div class="arrow">→</div>':''}`).join('')}</div>`}
function seqDiagram(){const L=['数据服务','股票池过滤','信号形成','仓位计算','模拟成交','指标计算'];const x=i=>90+i*172;const msgs=[[0,1,'快照 SYN-202601 · 仅信号日收盘可见',78,0],[1,2,'候选集 {SYN-A} · 成交额≥阈值',120,0],[2,3,'目标权重 100%（等权演示）',162,0],[3,4,'委托数量 · 校验资金与费用',248,0],[4,5,'成交 900 股 / 拒绝原因 + 现金',290,0],[0,5,'期末收盘价（2026-01-07）',332,1]];return `<svg class="seq" viewBox="0 0 1060 380" role="img" aria-label="一次调仓周期的系统时序图"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a97b8"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent2)"/></marker></defs>${L.map((n,i)=>`<rect class="head" x="${x(i)-62}" y="12" width="124" height="34" rx="8"/><text class="headtext" x="${x(i)}" y="34" text-anchor="middle">${n}</text><line class="lifeline" x1="${x(i)}" y1="50" x2="${x(i)}" y2="368"/>`).join('')}<line class="band" x1="20" y1="196" x2="1040" y2="196"/><text class="bandtext" x="30" y="190">信号日 2026-01-05 15:00 · 收盘后计算</text><text class="bandtext" x="30" y="216">执行日 2026-01-06 09:30 · 次日开盘成交</text>${msgs.map(([a,b,label,y,alt],i)=>{const x1=x(a),x2=x(b);return `<text class="msgnum" x="${Math.min(x1,x2)+6}" y="${y-8}">${i+1}</text><text x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle">${label}</text><line class="${alt?'msgalt':'msg'}" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" marker-end="url(#${alt?'ah2':'ah'})"/>`}).join('')}</svg>`}
function design(){const n=nodes.find(x=>x[0]===state.selectedNode),params={data:['快照 SYN-202601','包含价格、成交额、可见时间'],filter:['3只合成股票','符合最低成交额的候选集'],signal:['过滤后的候选集','SYN-A 收盘示例信号'],size:['目标比例、现金、参考价格','以100股为单位的数量'],fill:['次日开盘、数量、5元费用','成交或资金不足拒绝事件'],metric:['成交、现金与期末价格','按日净值与累计收益']};return shell('设计 · 处理流程图与时序图','从策略处理逻辑自动生成两张图：流程图看结构，时序图看一次调仓周期内组件的先后协作。',`<div class="panel"><div class="panelhead"><h2>量价策略 · 系统处理流程图</h2><span class="badge">${state.flow?'F'+state.flow.id:'待生成'} · 固定拓扑</span></div>${current()?flowGraph():'<div class="empty"><h2>等待设计产物</h2><p>请先在「需求」页确认规格并完成协作，流程图按当前需求版本生成。</p><button style="margin-top:15px" onclick="go(\'requirements\')">前往需求</button></div>'}<div class="pad"><div class="guide">${current()?'流程已绑定当前需求 R'+state.req.id+'。保存参数生成新流程版本；旧代码版本保持不变，新实验需要保存匹配的新版本。':'流程参数在协作完成后才可保存。'}</div><div class="cols"><div class="field"><label for="flowAmount">最低成交额（万元）</label><input id="flowAmount" type="number" value="${state.flow?.amount??1000}" ${!current()?'disabled':''}></div><div class="field"><label for="flowAllocation">投入比例（%）</label><input id="flowAllocation" type="number" value="${(state.flow?.allocation??1)*100}" ${!current()?'disabled':''}></div></div><div class="row"><button id="saveFlow" ${!current()?'disabled':''}>保存流程新版本</button><button class="primary" onclick="go('develop')" ${!current()?'disabled':''}>进入开发 →</button></div></div></div><div class="panel"><div class="panelhead"><h2>调仓周期 · 系统时序图</h2><span class="tag">${state.flow?'由 F'+state.flow.id+' 生成':'示意'}</span></div><div class="pad">${seqDiagram()}<p class="note">编号 ①–⑥ 对应事件调试中的事件顺序；虚线消息为期末定价输入。信号与成交分隔线强调：信号只用收盘可见数据，成交发生在次日开盘。</p></div></div><div class="panel"><div class="panelhead"><h2>设计说明</h2><span class="tag">会话内保存</span></div><div class="pad"><div class="field"><label for="designNote">设计文档备注（数据口径、假设、风险）</label><textarea id="designNote" placeholder="例如：信号仅使用信号日收盘前数据；费用按固定 5 元建模……">${esc(state.designNote)}</textarea></div><div class="row"><button id="saveNote">保存设计说明</button><small>原型仅保存在本次会话；正式版将纳入设计文档版本。</small></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>节点检查器</h3><span class="tag">${n[0]}</span></div><div class="pad"><h2>${n[1]}</h2><div class="kv"><span>输入</span><span>${params[n[0]][0]}</span><span>输出</span><span>${params[n[0]][1]}</span><span>代码位置</span><span>strategy.py : ${n[3]}</span></div><button data-source-line="${n[3]}" ${!current()?'disabled':''}>定位源码行 ${n[3]}</button><p class="note">流程图描述策略逻辑结构；时序图描述执行顺序；事件调试展示某次实验实际发生的输入与输出。</p></div></div>${sideDefault()}`)}
function saveFlow(){const amount=Number($('#flowAmount').value),allocation=Number($('#flowAllocation').value)/100;if(!Number.isFinite(amount)||amount<0||amount>10000||!Number.isFinite(allocation)||allocation<0.01||allocation>1){toast('请输入有效范围：成交额0～10000，投入比例1～100%');return}state.flow={id:++state.flowCount,req:state.req.id,amount,allocation};state.checked=null;log('保存流程 F'+state.flow.id+' · 代码需重新保存版本');render()}
function checkCode(){state.draftCode=$('#source').value;const variant=[1,2].find(x=>source(x)===state.draftCode);state.checked=variant?{source:state.draftCode,variant}:null;state.error=variant?'预置模型映射检查通过；Python未执行。':'此源码不匹配演示模型，无法运行。可保留编辑，或恢复预置示例。';log(state.error);render()}
function saveVersion(){if(!current()||!state.checked||state.checked.source!==state.draftCode){toast('请完成当前协作并检查源码');return}const existing=state.versions.find(v=>v.source===state.draftCode&&v.req.id===state.req.id&&v.flow.id===state.flow.id);if(existing){state.activeVersion=existing;toast('已选择现有版本 v'+existing.id);render();return}const v={id:state.versions.length+1,variant:state.checked.variant,source:state.draftCode,req:copy(state.req),flow:copy(state.flow),data:'SYN-202601',simulator:'1.0'};state.versions.push(v);state.activeVersion=v;log('保存不可变代码 v'+v.id+' · R'+v.req.id+' / F'+v.flow.id);render()}
function develop(){return shell('开发 · 策略代码与版本','审阅草稿，保存不可变版本；后续调试、验证与计划都绑定冻结版本。',`<div class="panel"><div class="panelhead"><h2>strategy.py <span class="tag">Python 示意</span></h2><div class="row"><button class="compact" id="restoreCode">恢复预置 v1</button><button class="compact" id="checkCode">检查映射</button></div></div><div class="editor"><div class="lines">${Array.from({length:16},(_,i)=>i+1).join('\n')}</div><textarea id="source" spellcheck="false" aria-label="策略源码">${esc(state.draftCode)}</textarea></div><div class="pad"><div class="row"><span id="codeStatus" class="${state.checked?'badge':'tag'}">${state.checked?'映射检查通过':'草稿待检查'}</span><small>源码编辑使检查失效；只运行明确匹配的预置演示模型。</small></div><p class="note ${state.checked?'':'error'}" id="codeError">${esc(state.error)}</p><div class="row"><button id="saveVersion" ${!state.checked||!current()?'disabled':''}>保存代码版本</button><button class="primary" id="runExperiment" ${!canRun()?'disabled':''}>运行选中版本实验 →</button></div><p class="note">运行版本：${state.activeVersion?'v'+state.activeVersion.id+' / R'+state.activeVersion.req.id+' / F'+state.activeVersion.flow.id:'尚未保存'}。编辑草稿不会修改该版本。</p></div></div><div class="panel"><div class="panelhead"><h2>审查建议 · 成交资金约束</h2><span class="tag">待应用</span></div><div class="pad"><p class="note">次日开盘与前收盘不一致，且存在固定费用。把可买数量计算移到执行阶段。</p><div class="diff"><span class="minus">− quantity = int(budget / signal.close / 100) * 100</span>\n<span class="plus">+ quantity = int(max(0, budget - 5) / execution.open / 100) * 100</span></div><div class="row" style="margin-top:12px"><button id="applyFix">应用修复到草稿</button><small>应用后重新检查并保存，不覆盖旧版本。</small></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>代码版本</h3><span class="tag">${state.versions.length} 个</span></div>${state.versions.length?state.versions.map(v=>`<div class="version"><div><b>v${v.id} ${state.activeVersion?.id===v.id?'· 已选中':''}</b><br><small>R${v.req.id} / F${v.flow.id} · ${v.variant===1?'原始逻辑':'修复逻辑'} · 验证${conclusionOf(v.id)}</small></div><div><button class="compact" data-version="${v.id}">选择</button><button class="compact" data-view-version="${v.id}">查看</button></div></div>`).join(''):'<div class="pad muted">保存后在此查看冻结版本。</div>'}</div>${sideDefault()}`)}
function canRun(){return current()&&state.activeVersion&&state.activeVersion.req.id===state.req.id&&state.activeVersion.flow.id===state.flow.id}
const fixture=[{symbol:'SYN-A',amount:2000,signal:true,close:10,open:10.1,marks:[10,10.4,10.8]},{symbol:'SYN-B',amount:1500,signal:false,close:20,open:20,marks:[20,20,20]},{symbol:'SYN-C',amount:500,signal:false,close:8,open:8,marks:[8,8,8]}];
function simulate(version){const v=copy(version),events=[],equity=[10000];let cash=10000,held=0,quantity=0,rejected=0;const emit=(date,symbol,node,input,output,status='完成')=>events.push({seq:events.length+1,date,symbol,node,visibleAt:date==='2026-01-05'?'2026-01-05 15:00':node==='metric'?date+' 15:00':date+' 09:30',line:nodes.find(n=>n[0]===node)[3],input,output,status});for(const stock of fixture){emit('2026-01-05',stock.symbol,'data',{snapshot:v.data},{close:stock.close,amount:stock.amount});const pass=stock.amount>=v.flow.amount;emit('2026-01-05',stock.symbol,'filter',{amount:stock.amount,min:v.flow.amount},{pass},pass?'通过':'过滤');if(pass)emit('2026-01-05',stock.symbol,'signal',{close:stock.close},{target:stock.signal},stock.signal?'形成目标':'无信号')}
const a=fixture[0];if(a.amount>=v.flow.amount){const budget=cash*v.flow.allocation;quantity=Math.floor((v.variant===1?budget/a.close:Math.max(0,budget-5)/a.open)/100)*100;emit('2026-01-06',a.symbol,'size',{cash,budget,referenceClose:a.close,executionOpen:a.open,fee:5},{quantity});const cost=quantity*a.open+(quantity?5:0);if(cost>cash){rejected++;emit('2026-01-06',a.symbol,'fill',{quantity,price:a.open,cost,cash},{reason:'资金不足',filled:0,cash},'拒绝')}else{held=quantity;cash=Math.round((cash-cost)*100)/100;emit('2026-01-06',a.symbol,'fill',{quantity,price:a.open,cost},{filled:held,cash},held?'成交':'无委托')}}
for(let i=1;i<3;i++){const value=Math.round((cash+held*a.marks[i])*100)/100;equity.push(value);emit('2026-01-0'+(5+i),'SYN-A','metric',{cash,held,close:a.marks[i]},{equity:value})}let peak=10000,drawdown=0;equity.forEach(x=>{peak=Math.max(peak,x);drawdown=Math.max(drawdown,(peak-x)/peak)});return {id:state.runs.length+1,version:v,events,equity,cash,held,rejected,quantity,final:equity.at(-1),returnPct:(equity.at(-1)/10000-1)*100,drawdownPct:drawdown*100,created:new Date().toISOString()}}
function runExperiment(){if(!canRun()){toast('当前版本与需求或流程不一致，请重新保存代码版本');return}const run=simulate(state.activeVersion);state.runs.push(run);state.selectedRun=state.runs.length-1;state.eventIndex=run.events.findIndex(e=>e.node==='fill');if(state.eventIndex<0)state.eventIndex=0;state.filters={date:'',symbol:'',node:''};log('实验 E'+run.id+' 完成 · v'+run.version.id+' · '+run.events.length+'条事件');go('debug')}
function visibleEvents(){const r=state.runs[state.selectedRun];return r?r.events.filter(e=>(!state.filters.date||e.date===state.filters.date)&&(!state.filters.symbol||e.symbol===state.filters.symbol)&&(!state.filters.node||e.node===state.filters.node)):[]}
function stopPlay(){clearInterval(state.playTimer);state.playTimer=null}
function step(){const events=visibleEvents(),r=state.runs[state.selectedRun];if(!r||!events.length){stopPlay();return}const idx=events.findIndex(e=>r.events.indexOf(e)===state.eventIndex);if(idx>=events.length-1){stopPlay();render();return}state.eventIndex=r.events.indexOf(events[idx+1]);render()}
function options(items,value){return '<option value="">全部</option>'+items.map(x=>`<option value="${esc(x[0]??x)}" ${(x[0]??x)===value?'selected':''}>${esc(x[1]??x)}</option>`).join('')}
function debug(){const r=state.runs[state.selectedRun];if(!r)return shell('调试 · 正确性验证','沿事件轨迹回答"为什么"：订单为何被拒绝、信号用了哪个时点的数据。','<div class="panel empty"><h2>还没有运行记录</h2><p>先保存一个策略版本，再运行固定样本实验。调试看单笔行为，回测看整体表现，二者都不是收益证明。</p><button style="margin-top:15px" onclick="go(\'develop\')">进入开发</button></div>');const event=r.events[state.eventIndex],events=visibleEvents();return shell('调试 · 正确性验证','从订单结果追溯到信号、仓位和当时可见的数据。调试回答"为什么"，不回答"赚不赚钱"。',`<div class="panel"><div class="panelhead"><div class="row"><h2>实验 E${r.id}</h2><span class="tag">v${r.version.id} / R${r.version.req.id} / F${r.version.flow.id}</span></div><select id="runSelect" style="width:155px">${state.runs.map((x,i)=>`<option value="${i}" ${i===state.selectedRun?'selected':''}>E${x.id} · v${x.version.id}</option>`).join('')}</select></div><div class="trace">${nodes.map(n=>`<button class="${event?.node===n[0]?'active':''}" data-trace="${n[0]}">${n[1]} →</button>`).join('')}</div><div class="filterbar"><select id="dateFilter" aria-label="日期筛选">${options(['2026-01-05','2026-01-06','2026-01-07'].map(x=>[x,x]),state.filters.date)}</select><select id="symbolFilter" aria-label="股票筛选">${options(fixture.map(x=>[x.symbol,x.symbol]),state.filters.symbol)}</select><select id="nodeFilter" aria-label="节点筛选">${options(nodes.map(x=>[x[0],x[1]]),state.filters.node)}</select><button class="compact" id="resetFilters">清空</button></div><div class="tablewrap"><table><thead><tr><th>序号 / 日期</th><th>股票</th><th>节点</th><th>结果</th></tr></thead><tbody>${events.map(e=>`<tr data-event="${r.events.indexOf(e)}" class="${e===event?'selected':''}"><td>#${e.seq} <small>${e.date}</small></td><td>${e.symbol}</td><td>${nodes.find(n=>n[0]===e.node)[1]}</td><td class="${e.status==='拒绝'?'error':''}">${e.status}</td></tr>`).join('')||'<tr><td colspan="4">当前条件没有事件</td></tr>'}</tbody></table></div><div class="pad row"><button id="rewind">回到首条</button><button id="step">单步 →</button><button id="play">${state.playTimer?'暂停回放':'播放事件'}</button><span class="tag">事件 ${events.includes(event)?event.seq:'—'} / ${r.events.length}</span></div></div><div class="panel"><div class="panelhead"><h2>调试结论与下一步</h2><span class="tag">分析模板</span></div><div class="pad"><p>${r.rejected?'资金不足导致订单拒绝。检查仓位节点的参考价格，并在执行阶段计入费用。':r.held?'数量通过资金约束，成交和账户事件已生成。请到「验证」页查看回测表现并下结论。':'本次没有持仓。检查筛选条件与投入比例。'}</p><p class="note">依据：E${r.id} 的仓位、成交及指标事件。结果由模拟器计算，分析文案来自模板。</p><div class="row"><button onclick="go('develop')">查看代码与修复建议</button><button class="primary" onclick="go('validate')">前往验证 →</button></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>事件检查器</h3><span class="tag">${event&&events.includes(event)?'#'+event.seq:'无选择'}</span></div><div class="pad">${event&&events.includes(event)?`<h3>${event.symbol} · ${event.status}</h3><p class="note">可见时点 ${event.visibleAt}<br>来源：E${r.id} / v${r.version.id} / ${r.version.simulator}</p><small>输入</small><pre class="payload">${esc(JSON.stringify(event.input,null,2))}</pre><small>输出</small><pre class="payload">${esc(JSON.stringify(event.output,null,2))}</pre><button id="eventSource">查看冻结源码 : ${event.line}</button>`:'<p class="note">选择一条筛选后的事件。</p>'}</div></div><div class="panel pad"><h3>回放而非实时调试器</h3><p class="note">此处播放已完成实验的事件。原生工具后续接入断点与 worker 暂停协议。</p></div>`)}
function chart(){const runs=state.runs.slice(-2),vals=runs.flatMap(x=>x.equity),min=Math.min(10000,...vals)-50,max=Math.max(10100,...vals)+50,y=x=>190-(x-min)/(max-min)*150;return `<svg class="chart" viewBox="0 0 680 235" role="img" aria-label="最近两次实验净值曲线">${[0,1,2,3].map(i=>{let v=min+(max-min)*i/3;return `<line x1="62" y1="${y(v)}" x2="646" y2="${y(v)}"/><text x="5" y="${y(v)+4}">${v.toFixed(0)}</text>`}).join('')}${runs.map((r,i)=>`<polyline fill="none" stroke="${i?'#6b7aee':'#8a97b8'}" stroke-width="3" points="${r.equity.map((v,j)=>(75+j*280)+','+y(v)).join(' ')}"/>${r.equity.map((v,j)=>`<circle cx="${75+j*280}" cy="${y(v)}" r="4" fill="${i?'#6b7aee':'#8a97b8'}"/>`).join('')}`).join('')}<text x="62" y="220">01-05 信号</text><text x="310" y="220">01-06 执行</text><text x="572" y="220">01-07 期末</text></svg>`}
function divergence(){if(state.runs.length<2)return null;const [a,b]=state.runs.slice(-2);for(const e of a.events){const other=b.events.find(x=>x.date===e.date&&x.symbol===e.symbol&&x.node===e.node);if(!other||JSON.stringify(e.output)!==JSON.stringify(other.output))return {a,b,event:e,other}}return null}
function validate(){if(!state.runs.length)return shell('验证 · 回测与结论','回测回答"历史上表现如何"；验证综合调试与回测，对"结果可信吗"下结论。','<div class="panel empty"><h2>等待第一个实验</h2><p>回测是验证的手段而非验证本身。运行代码版本后，净值、指标与验证清单将在这里生成。</p><button style="margin-top:15px" onclick="go(\'develop\')">进入开发</button></div>');const r=state.runs.at(-1),d=divergence();const vv=state.versions.find(v=>v.id===state.valVer)||state.activeVersion||state.versions.at(-1);const chk=vv?state.validations[vv.id]||{}:{},concl=vv?conclusionOf(vv.id):'—';return shell('验证 · 回测与结论','只有结论为「通过」的版本才能进入交易计划。样本外与真实数据检验留待正式实现。',`<div class="stats"><div class="panel stat"><small>最新期末净值</small><strong>${money(r.final)}</strong><small>初始 10,000.00 元</small></div><div class="panel stat"><small>累计收益 · 合成样本</small><strong>${r.returnPct.toFixed(2)}%</strong><small>不年化 · 仅3个交易日</small></div><div class="panel stat"><small>成交 / 拒绝</small><strong>${r.held?1:0} / ${r.rejected}</strong><small>持仓 ${r.held} 股</small></div></div><div class="panel"><div class="panelhead"><h2>净值比较 · 回测结果</h2><div class="row">${state.runs.slice(-2).map((x,i)=>`<small style="color:${i?'var(--accent)':'#8a97b8'}">● E${x.id} / v${x.version.id}</small>`).join('')}</div></div><div class="pad">${chart()}<small>每个点来自冻结样本的账户计算；两次以上实验时显示最近两次。</small></div></div><div class="panel"><div class="panelhead"><h2>验证清单</h2><div class="row"><label for="valVer" style="font-size:12px">版本</label><select id="valVer" style="width:150px">${state.versions.map(v=>`<option value="${v.id}" ${vv&&v.id===vv.id?'selected':''}>v${v.id} · ${v.variant===1?'原始':'修复'}</option>`).join('')}</select><span class="${concl==='通过'?'badge':concl==='存疑'?'warn badge':'tag'}">结论：${concl}</span></div></div><div class="pad">${vv?checkItems.map(([k,title,desc])=>`<div class="checkitem"><div style="flex:1"><b style="font-size:13px">${title}</b><p>${desc}</p></div><div class="row">${['通过','存疑','未评'].map(opt=>`<button class="compact" data-vcheck="${vv.id}:${k}:${opt}" style="${(chk[k]||'未评')===opt?opt==='存疑'?'border-color:var(--amber);color:var(--amber)':opt==='通过'?'border-color:var(--accent);color:var(--accent);background:var(--soft)':'':''}">${opt}</button>`).join('')}</div></div>`).join(''):'<p class="note">尚无版本。</p>'}<p class="note">清单结论只是原型内的人工评审记录；「通过」不等于真实市场有效。样本外区间、真实数据与原生引擎检验在正式实现中完成。</p></div></div><div class="panel"><div class="panelhead"><h2>实验记录</h2><button id="exportExperiments">导出实验 JSON</button></div><div class="tablewrap"><table><thead><tr><th>实验 / 版本</th><th>需求 / 流程</th><th>收益</th><th>最大回撤</th><th>期末现金</th><th>操作</th></tr></thead><tbody>${state.runs.map(x=>`<tr><td>E${x.id} / v${x.version.id}</td><td>R${x.version.req.id} / F${x.version.flow.id}</td><td>${x.returnPct.toFixed(2)}%</td><td>${x.drawdownPct.toFixed(2)}%</td><td>${money(x.cash)}</td><td><button class="compact" data-debug-run="${x.id-1}">调试</button><button class="compact" data-manifest="${x.id-1}">快照</button></td></tr>`).join('')}</tbody></table></div></div>`,`<div class="panel"><div class="panelhead"><h3>首个分歧</h3><span class="badge">事件比对</span></div><div class="pad">${d?`<h3>${nodes.find(n=>n[0]===d.event.node)[1]}</h3><p class="note">${d.event.date} · ${d.event.symbol}</p><pre class="payload">E${d.a.id}: ${esc(JSON.stringify(d.event.output))}\nE${d.b.id}: ${esc(JSON.stringify(d.other?.output??'事件缺失'))}</pre><button id="jumpDivergence">定位首个分歧</button>`:state.runs.length<2?'<p class="note">完成修复并运行第二个版本后，这里会显示首个不同的事件输出。</p>':'<p class="note">最近两次实验输出一致。</p>'}</div></div><div class="panel pad"><h3>验证 ≠ 回测</h3><p class="note">回测给出净值与指标；调试解释事件成因；验证是你依据两者对清单逐项下结论。结论「通过」的版本才允许生成交易计划。</p><button class="primary" onclick="go('plan')" ${validatedVersions().length?'':'disabled'}>进入交易计划 →</button><p class="note">模板读取 E${r.id}：${r.rejected?'存在资金不足拒绝。':r.held?'资金约束通过，已建立持仓。':'无持仓。'}收益 ${r.returnPct.toFixed(2)}%，由账户事件计算。</p></div>`)}
function planRowsCalc(v){const price=fixture[0].marks[2],budget=state.planCash*v.flow.allocation,target=Math.floor(budget/price/100)*100;let buys=0;const rows=fixture.map(s=>{const tgt=s.symbol==='SYN-A'?target:0,cur=state.planHoldings[s.symbol]||0,delta=tgt-cur;let check;if(delta>0){const cost=delta*price+5;buys+=cost;check=cost<=state.planCash?`通过 · 需 ¥${money(cost)}（含5元费用）`:`资金不足 · 需 ¥${money(cost)}`}else if(delta<0){check=-delta<=cur?`通过 · 卖出 ${-delta} 股 ≤ 持仓`:'超出现有持仓'}else check='无需调整';return {symbol:s.symbol,target:tgt,current:cur,delta,check,pass:!check.startsWith('资金不足')&&!check.startsWith('超出')}});return {rows,price,budget,buys}}
function plan(){const valid=validatedVersions();if(!valid.length)return shell('交易计划 · 前向核对','这不是回测：只对最新一个时点核对"下一个交易日做什么"，不产生净值曲线。','<div class="panel empty"><h2>尚无验证通过的版本</h2><p>交易计划只允许使用验证结论为「通过」的冻结版本。请先在「验证」页完成清单评审。</p><button style="margin-top:15px" onclick="go(\'validate\')">前往验证</button></div>');const v=valid.find(x=>x.id===state.planSel)||valid.at(-1);state.planSel=v.id;const calc=state.planResult&&state.planResult.vid===v.id?state.planResult:null;return shell('交易计划 · 前向核对','这不是回测：只对最新一个时点核对"下一个交易日做什么"。人工执行，不自动下单。',`<div class="panel"><div class="panelhead"><h2>计划输入</h2><span class="tag">冻结输入 · 不可改历史</span></div><div class="pad"><div class="kv"><span>策略版本</span><span>v${v.id} · ${v.variant===1?'原始逻辑':'修复逻辑'}（验证通过）</span><span>需求 / 流程</span><span>R${v.req.id} / F${v.flow.id}</span><span>数据快照</span><span>${v.data} · 期末参考价 2026-01-07 收盘（演示）</span><span>模拟器</span><span>${v.simulator} · 投入比例 ${v.flow.allocation*100}%</span></div><div class="cols"><div class="field"><label for="planCash">可用现金（元）</label><input id="planCash" type="number" min="0" max="100000000" value="${state.planCash}"></div><div class="field"><label>当前持仓（股，手工录入）</label><div class="row">${fixture.map(s=>`<input data-ph="${s.symbol}" type="number" min="0" step="100" value="${state.planHoldings[s.symbol]||0}" aria-label="${s.symbol} 当前股数" title="${s.symbol}">`).join('')}</div></div></div><div class="row"><button class="primary" id="genPlan">生成 / 重新生成计划</button><small>SYN-A / SYN-B / SYN-C；买入按 100 股整手，卖出不超过持仓。</small></div></div></div>${calc?`<div class="panel"><div class="panelhead"><div class="row"><h2>持仓调整清单</h2><span class="${calc.rows.every(x=>x.pass)?'badge':'warn badge'}">${calc.rows.every(x=>x.pass)?'约束核对通过':'存在未通过项'}</span></div><button id="exportPlan">导出 CSV（演示标识）</button></div><div class="tablewrap"><table><thead><tr><th>标的</th><th>期末参考价</th><th>当前股数</th><th>目标股数</th><th>建议调整</th><th>约束核对</th></tr></thead><tbody>${calc.rows.map(x=>`<tr><td><b>${x.symbol}</b></td><td>${money(calc.price)}</td><td>${x.current}</td><td>${x.target}</td><td class="${x.delta>0?'ok':x.delta<0?'error':''}">${x.delta>0?'买入 +':x.delta<0?'卖出 ':''}${x.delta===0?'保持':Math.abs(x.delta)}${x.delta===0?'':' 股'}</td><td class="${x.pass?'':'error'}">${x.check}</td></tr>`).join('')}</tbody></table></div><div class="pad"><p class="note">买入合计约 ¥${money(calc.buys)}（含每笔5元费用），与现金 ¥${money(state.planCash)} 核对；目标市值 = 现金 × 投入比例 ${v.flow.allocation*100}%。正式版将按交易规则、可卖库存与税费细核。</p></div></div>`:'<div class="panel empty"><h2>尚未生成计划</h2><p>确认现金与持仓后点击生成；计划绑定冻结版本与数据快照。</p></div>'}`,`<div class="panel"><div class="panelhead"><h3>计划与回测的区别</h3></div><div class="pad"><p class="note"><b>回测</b>：历史区间反复模拟，产出净值与指标。<br><b>本页</b>：用同一冻结版本，只在最新时点计算一次目标持仓并核对约束，供人工执行参考。</p><p class="note">导出文件包含演示标识与版本信息；人工登记成交不伪装为自动执行。</p></div></div>${sideDefault()}`)}
function genPlan(){const cash=Number($('#planCash').value),h={};let ok=Number.isFinite(cash)&&cash>=0&&cash<=1e8;document.querySelectorAll('[data-ph]').forEach(x=>{const n=Number(x.value);if(!Number.isInteger(n)||n<0||n>1e7)ok=false;h[x.dataset.ph]=n});if(!ok)return toast('请输入有效现金与非负整数持仓');state.planCash=cash;state.planHoldings=h;const v=state.versions.find(x=>x.id===state.planSel);state.planResult={vid:v.id,...planRowsCalc(v)};log('生成交易计划 · v'+v.id+' · 现金 '+money(cash));render()}
function exportPlan(){const calc=state.planResult;if(!calc)return toast('请先生成计划');const v=state.versions.find(x=>x.id===calc.vid);let csv='\ufeff说明,演示计划，非交易指令，人工执行\n版本,v'+v.id+' / R'+v.req.id+' / F'+v.flow.id+' / 快照 '+v.data+'\n数据截至,2026-01-07（合成样本期末）\n代码,期末参考价,当前股数,目标股数,建议调整,约束核对\n'+calc.rows.map(x=>[x.symbol,calc.price,x.current,x.target,x.delta,x.check].join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download='研序-演示交易计划-20260107.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);state.planExported=true;log('导出演示交易计划 CSV · v'+v.id);render();toast('已导出带演示标识的 CSV 计划')}
function exportExperiments(){const data={kind:'研究工程台演示结果',disclaimer:'合成样本与预置模拟器，非真实A股回测',fixture,simulator:'1.0',runs:state.runs};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='研究项目-实验记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);log('导出实验、冻结源码、参数、数据样本与事件')}
function bind(){document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{state.selectedAgent=Number(b.dataset.agent);render()});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{state.selectedNode=b.dataset.node;render()});document.querySelectorAll('[data-source-line]').forEach(b=>b.onclick=()=>{go('develop');const line=Number(b.dataset.sourceLine),el=$('#source'),start=el.value.split('\n').slice(0,line-1).join('\n').length+1;el.focus();el.setSelectionRange(start,start+el.value.split('\n')[line-1].length);toast('已定位 strategy.py 第'+line+'行')});const actions={confirmReq,startAgents,cancelAgents:()=>cancelAgents(),saveFlow,saveNote:()=>{state.designNote=$('#designNote').value;log('保存设计说明（会话内）');toast('设计说明已保存在本次会话')},checkCode,saveVersion,runExperiment,genPlan,exportPlan,restoreCode:()=>{state.draftCode=source(1);state.checked=null;state.error='已恢复预置草稿';render()},applyFix:()=>{state.draftCode=source(2);state.checked=null;state.error='修复已应用到草稿，请检查并保存新版本';log(state.error);render()},resetFilters:()=>{stopPlay();state.filters={date:'',symbol:'',node:''};render()},rewind:()=>{stopPlay();const es=visibleEvents();if(es.length)state.eventIndex=state.runs[state.selectedRun].events.indexOf(es[0]);render()},step,play:()=>{if(state.playTimer){stopPlay();render()}else{state.playTimer=setInterval(step,700);render()}},eventSource:()=>{const r=state.runs[state.selectedRun],e=r.events[state.eventIndex];modal('冻结源码 v'+r.version.id+' · 事件定位第'+e.line+'行',r.version.source.split('\n').map((x,i)=>(i+1===e.line?'▶ ':'  ')+String(i+1).padStart(2)+' '+x).join('\n'))},exportExperiments,jumpDivergence:()=>{const d=divergence();state.selectedRun=state.runs.indexOf(d.b);state.eventIndex=d.other?d.b.events.indexOf(d.other):0;state.filters={date:'',symbol:'',node:''};go('debug')}};for(const [id,fn] of Object.entries(actions))if($('#'+id))$('#'+id).onclick=fn;
if($('#reqText'))$('#reqText').oninput=e=>state.reqText=e.target.value;if($('#reqAcc'))$('#reqAcc').oninput=e=>state.acceptance=e.target.value;if($('#allocation'))$('#allocation').oninput=e=>state.draftAllocation=e.target.value;if($('#amount'))$('#amount').oninput=e=>state.draftAmount=e.target.value;
if($('#source'))$('#source').oninput=e=>{state.draftCode=e.target.value;state.checked=null;$('#saveVersion').disabled=true;$('#codeStatus').textContent='已修改 · 检查失效';$('#codeStatus').className='tag';$('#codeError').textContent='草稿未执行；运行按钮使用已保存的选中版本。'};
if($('#valVer'))$('#valVer').onchange=e=>{state.valVer=Number(e.target.value);render()};document.querySelectorAll('[data-vcheck]').forEach(b=>b.onclick=()=>{const [vid,key,opt]=b.dataset.vcheck.split(':');const id=Number(vid);state.validations[id]=state.validations[id]||{};state.validations[id][key]=opt;const c=conclusionOf(id);log('验证清单 v'+id+' · '+key+' → '+opt+'（结论：'+c+'）');render()});
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{state.activeVersion=state.versions.find(v=>v.id===Number(b.dataset.version));render()});document.querySelectorAll('[data-view-version]').forEach(b=>b.onclick=()=>{const v=state.versions.find(v=>v.id===Number(b.dataset.viewVersion));modal('只读代码 v'+v.id+' / R'+v.req.id+' / F'+v.flow.id,v.source)});
if($('#runSelect'))$('#runSelect').onchange=e=>{stopPlay();state.selectedRun=Number(e.target.value);state.eventIndex=0;state.filters={date:'',symbol:'',node:''};render()};for(const key of ['date','symbol','node'])if($('#'+key+'Filter'))$('#'+key+'Filter').onchange=e=>{stopPlay();state.filters[key]=e.target.value;const es=visibleEvents();state.eventIndex=es.length?state.runs[state.selectedRun].events.indexOf(es[0]):-1;render()};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{stopPlay();state.eventIndex=Number(b.dataset.event);render()});document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>{stopPlay();state.filters={date:'',symbol:'',node:b.dataset.trace};const es=visibleEvents();state.eventIndex=es.length?state.runs[state.selectedRun].events.indexOf(es[0]):-1;render()});document.querySelectorAll('[data-debug-run]').forEach(b=>b.onclick=()=>{state.selectedRun=Number(b.dataset.debugRun);state.eventIndex=0;state.filters={date:'',symbol:'',node:''};go('debug')});document.querySelectorAll('[data-manifest]').forEach(b=>b.onclick=()=>{const r=state.runs[Number(b.dataset.manifest)];modal('实验 E'+r.id+' 冻结清单',JSON.stringify(r.version,null,2))})}
function render(){$('#nav').innerHTML=Object.entries(pages).map(([k,v],i)=>`<button class="${state.page===k?'active':''}" data-nav="${k}" ${state.page===k?'aria-current="page"':''}><span class="num">0${i+1}</span>${v[0]}</button>`).join('');$('#crumb').textContent=pages[state.page][0];$('#stamps').innerHTML=stamps();$('#app').innerHTML=({requirements,design,develop,debug,validate,plan})[state.page]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#logs').innerHTML=state.logs.slice(-3).map(x=>'<div>'+esc(x)+'</div>').join('');bind();const selected=$('tr[data-event].selected');if(selected){const container=selected.closest('.tablewrap'),delta=selected.getBoundingClientRect().top-container.getBoundingClientRect().top;if(delta>container.clientHeight-50)container.scrollTop+=delta-container.clientHeight/2}}
$('#theme').onclick=()=>document.body.classList.toggle('light');window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(Object.hasOwn(pages,p)&&p!==state.page){stopPlay();state.page=p;render()}});render();
</script></body></html>
