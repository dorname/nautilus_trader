<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),copy=x=>JSON.parse(JSON.stringify(x)),money=x=>Number(x).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pages={requirements:'需求描述',agents:'Agent 协作',workflow:'处理流程',code:'策略开发',debug:'事件调试',experiments:'回测实验'};
const nodes=[['data','读取数据','行情与可见时间',3],['filter','股票池过滤','成交额与示例信号',5],['signal','形成信号','收盘后生成目标',7],['size','计算仓位','数量与资金约束',10],['fill','模拟成交','订单与拒绝原因',13],['metric','计算指标','现金与期末净值',15]];
const roles=[['需求 Agent','确认规格','requirements'],['数据 Agent','样本与可见时间','data'],['研究 Agent','假设与失效条件','research'],['流程 Agent','处理图与节点契约','flow'],['开发 Agent','代码草稿与参数','developer'],['审查 Agent','检查清单与修复建议','review']];
const source=variant=>`# 研究策略代码示意；由预置模拟器映射，不执行 Python\ndef generate_targets(history, parameters, execution, simulation):\n    data = history.visible_at("2026-01-05 15:00")\n    # 仅使用信号日已知数据\n    pool = data.filter(amount_min=parameters["amount_min"])\n    # 示例：仅 SYN-A 满足量价信号\n    signal = pool.match("SYN-A")\n    cash = 10000\n    budget = cash * parameters["allocation"]\n    quantity = int(${variant===1?'budget / signal.close':'max(0, budget - 5) / execution.open'} / 100) * 100\n    # 下一交易日开盘；固定演示费用 5 元\n    # v${variant}：${variant===1?'旧逻辑，未检查跳空与费用':'修复，在成交阶段校验可买数量'}\n    fill = simulation.buy(quantity, fee=5)\n    # 结果来自成交及账户事件\n    return simulation.mark_to_market(fill)\n`;
const state={page:Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'requirements',req:null,reqText:'研究 A股日线量价信号。收盘后筛选流动性充足的股票，下一交易日执行，先检查资金与费用约束，再比较修复前后结果。仅研究，不自动下单。',draftAllocation:100,draftAmount:1000,flow:null,reqCount:0,flowCount:0,agentStatus:roles.map(()=> '待执行'),artifacts:[],selectedAgent:0,agentReq:0,agentRun:0,agentTimer:null,busy:false,budget:6,used:0,selectedNode:'size',draftCode:source(1),checked:null,versions:[],activeVersion:null,runs:[],selectedRun:0,eventIndex:0,filters:{date:'',symbol:'',node:''},playTimer:null,logs:['工作台就绪 · 从确认需求开始完整研究旅程'],error:''};
function log(s){state.logs.push(new Date().toLocaleTimeString('zh-CN')+'  '+s);$('#logs').innerHTML=state.logs.slice(-3).map(x=>'<div>'+esc(x)+'</div>').join('')}
function toast(s){$('#notice').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#notice').textContent='',3500)}
function modal(t,v){$('#dialogTitle').textContent=t;$('#dialogBody').textContent=v;$('#dialog').showModal()}
function go(p){stopPlay();state.page=p;location.hash=p;state.error='';render()}
function current(){return state.req&&state.flow&&state.flow.req===state.req.id&&state.agentReq===state.req.id&&state.agentStatus.every(x=>x==='已完成')}
function stamps(){return `<div class="row"><span class="tag">需求 ${state.req?'R'+state.req.id:'未确认'}</span><span class="tag">流程 ${state.flow?'F'+state.flow.id:'待生成'}</span><span class="tag">代码 ${state.activeVersion?'v'+state.activeVersion.id:'草稿'}</span></div>`}
function shell(title,desc,body,side,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${action||stamps()}</div><div class="stepbar">${['需求确认','协作产物','流程与开发','调试实验','结果比较'].map((x,i)=>`<span class="${[!!state.req,current(),!!state.versions.length,!!state.runs.length,state.runs.length>1][i]?'done':''}">0${i+1} ${x}</span>`).join('')}</div><div class="workspace"><div class="stack">${body}</div><aside class="stack" style="align-content:start">${side||sideDefault()}</aside></div>`}
function sideDefault(){return `<div class="panel"><div class="panelhead"><h3>项目上下文</h3><span class="badge">可追溯</span></div><div class="pad"><div class="kv"><span>研究市场</span><span>A股 · 日线</span><span>数据快照</span><span>SYN-202601</span><span>计算方式</span><span>固定样本模拟器</span><span>模型连接</span><span>未接入 · 预设产物</span><span>项目状态</span><span>${!state.req?'等待确认需求':current()?'产物就绪':'等待协作更新'}</span></div><p class="note">源码与 Agent 为交互演示。行情为合成样本，实验由演示模拟器计算。</p></div></div><div class="panel"><div class="panelhead"><h3>研究产物</h3></div><div class="pad timeline"><div><strong>需求与约束</strong><small>${state.req?'R'+state.req.id+' 已确认':'待确认结构化规格'}</small></div><div><strong>策略处理图</strong><small>${state.flow?'F'+state.flow.id+' · 6 个处理节点':'等待流程 Agent'}</small></div><div><strong>不可变代码版本</strong><small>${state.versions.length} 个版本</small></div><div><strong>实验与事件证据</strong><small>${state.runs.length} 次实验 · 可导出</small></div></div></div>`}
function requirements(){return shell('把研究想法变成可验证的策略','先描述研究目标，再确认这次实验的具体约束。',`<div class="panel"><div class="panelhead"><h2>策略需求</h2><span class="badge">01 / 研究起点</span></div><div class="pad"><div class="field"><label for="reqText">你希望研究什么？</label><textarea id="reqText">${esc(state.reqText)}</textarea></div><div class="guide">示例任务：验证信号日与成交日的价格差异如何影响资金约束。原型不会自动解析任意文本；请确认下方结构化参数。</div><div class="cols"><div class="field"><label for="allocation">投入比例（%）</label><input id="allocation" type="number" min="1" max="100" value="${state.draftAllocation}"></div><div class="field"><label for="amount">最低成交额（万元）</label><input id="amount" type="number" min="0" max="10000" value="${state.draftAmount}"></div></div><div class="kv"><span>研究窗口</span><span>2026-01-05 → 2026-01-07</span><span>初始资金</span><span>10,000.00 元 · 合成样本3只</span><span>执行假设</span><span>收盘信号 → 次日开盘；100股单位，5元固定费用</span><span>验收目标</span><span>定位订单拒绝原因，保存修复版本，比较两个实验</span></div><p class="error" id="formError">${esc(state.error)}</p><div class="row" style="margin-top:18px"><button class="primary" id="confirmReq">确认规格并保存需求版本</button>${state.req?'<button onclick="go(\'agents\')">进入 Agent 协作 →</button>':''}</div></div></div><div class="panel"><div class="panelhead"><h2>研究边界</h2></div><div class="pad cols"><div><h3>从证据出发</h3><p class="note">角色输出保存为产物；实验使用冻结版本。上游改动后重新生成下游，不改写历史实验。</p></div><div><h3>聚焦研究</h3><p class="note">支持人工检查与计划导出，不接入券商下单。真实数据、模型服务和原生运行时待实现。</p></div></div></div>`)}
function confirmReq(){const text=$('#reqText').value.trim(),allocation=Number($('#allocation').value),amount=Number($('#amount').value);state.reqText=text;state.draftAllocation=allocation;state.draftAmount=amount;if(!text||!Number.isFinite(allocation)||allocation<1||allocation>100||!Number.isFinite(amount)||amount<0||amount>10000){state.error='请填写需求，投入比例为1～100%，最低成交额为0～10000万元。';render();return}cancelAgents(false);state.req={id:++state.reqCount,text,allocation:allocation/100,amount};state.agentStatus=roles.map(()=> '已过期');state.checked=null;state.error='';log('确认需求 R'+state.req.id+' · 旧产物保留，等待重新生成');go('agents')}
function agentNode(i){return `<button class="node ${state.selectedAgent===i?'selected':''} ${state.agentStatus[i]==='执行中'?'running':state.agentStatus[i]==='已完成'?'complete':''}" data-agent="${i}"><b>${roles[i][0]}</b><small>${roles[i][1]}</small><span class="${state.agentStatus[i]==='已完成'?'badge':'tag'}">${state.agentStatus[i]}</span></button>`}
function agents(){const a=state.artifacts.findLast(x=>x.role===state.selectedAgent),side=`<div class="panel"><div class="panelhead"><h3>产物检查器</h3><span class="tag">预设演示</span></div><div class="pad"><h3>${roles[state.selectedAgent][0]}</h3>${a?`<div class="kv"><span>输入版本</span><span>R${a.req}</span><span>产物状态</span><span>${a.req===state.req?.id?'当前版本':'已过期'}</span><span>提交时间</span><span>${esc(a.time)}</span></div><div class="artifact">${esc(a.text)}</div>`:'<p class="note">点击开始协作后查看该角色的可见动作、依据和输出。</p>'}</div></div><div class="panel pad"><h3>协调规则</h3><p class="note">数据与研究角色处于同一依赖层。其余角色按依赖执行；取消会停止后续产物提交，重试使用当前需求。</p><p class="note">操作预算为模拟步骤数，不是 token 或真实费用。</p></div>`;return shell('多 Agent 协作','把协作过程展开为依赖、可见动作与版本化产物。',`<div class="stats"><div class="panel stat"><small>协作角色</small><strong>6 + 1</strong><small>6个前置角色 / 1个实验分析角色</small></div><div class="panel stat"><small>本次已提交</small><strong>${state.used} / 6</strong><small>预设角色产物</small></div><div class="panel stat"><small>需求版本</small><strong>${state.req?'R'+state.req.id:'—'}</strong><small>${state.busy?'协调器运行中':current()?'依赖已满足':'待执行或更新'}</small></div></div><div class="panel"><div class="panelhead"><h2>Agent 依赖图</h2><span class="tag">点击角色检查产物</span></div><div class="graph agentgraph">${agentNode(0)}<div class="arrow">→</div><div class="parallel">${agentNode(1)}${agentNode(2)}</div><div class="arrow">→</div>${agentNode(3)}<div class="wide row" style="justify-content:flex-end"><span class="muted">流程产物 →</span><div style="width:160px">${agentNode(4)}</div><span class="arrow">→</span><div style="width:160px">${agentNode(5)}</div></div></div><div class="pad"><div class="row"><label for="budget">步骤预算</label><input style="width:80px" id="budget" type="number" min="1" max="6" value="${state.budget}" ${state.busy?'disabled':''}><button class="primary" id="startAgents" ${!state.req||state.busy?'disabled':''}>${state.used?'重新执行协作':'开始协作'}</button><button id="cancelAgents" ${!state.busy?'disabled':''}>取消任务</button><button onclick function artifactText(i){const r=state.req;return [`读取：用户确认的 R${r.id}\n输出：日线信号；投入比例${r.allocation*100}%；最低成交额${r.amount}万元。\n验收：拒绝原因可定位，修复前后可比较。`,`读取：SYN-202601 合成快照\n输出：3只示例股票、3个交易日。\n依据：信号只使用2026-01-05收盘数据，次日开盘作为执行事件输入。`,`读取：R${r.id}与固定示例假设\n假设：SYN-A 满足量价条件。\n反例：跳空与交易费用会使满仓数量不可买。\n限制：小样本只能验证流程，不能论证盈利能力。`,`读取：数据与研究产物\n输出：读取→过滤→信号→仓位→成交→指标。\n参数：最低成交额${r.amount}万元；投入${r.allocation*100}%。`,`读取：流程节点定义\n输出：v1代码草稿与节点行号映射。\n注意：Python仅为展示；预置模拟器执行等价示例。`,`读取：代码草稿与资金约束\n检查：信号和成交不同日。\n待验证：v1可能以信号价格计算超额数量。\n建议：先跑基线，再按拒绝事件应用修复。`][i]}
function startAgents(){state.budget=Number($('#budget').value);if(!Number.isInteger(state.budget)||state.budget<1||state.budget>6){toast('步骤预算必须是1～6的整数');return}cancelAgents(false);state.agentReq=0;state.agentStatus=roles.map(()=> '待执行');state.used=0;state.busy=true;const token=++state.agentRun,layers=[[0],[1,2],[3],[4],[5]];let layer=0;log('协调器启动 · 输入 R'+state.req.id);function next(){if(token!==state.agentRun)return;const ids=layers[layer];if(state.used+ids.length>state.budget){state.busy=false;ids.forEach(i=>state.agentStatus[i]='预算不足');log('协作停止 · 当前依赖层预算不足，调整后重试');render();return}ids.forEach(i=>state.agentStatus[i]='执行中');render();state.agentTimer=setTimeout(()=>{if(token!==state.agentRun)return;ids.forEach(i=>{state.agentStatus[i]='已完成';state.used++;state.artifacts.push({role:i,req:state.req.id,time:new Date().toLocaleTimeString('zh-CN'),text:artifactText(i)});log(roles[i][0]+' 提交产物 · R'+state.req.id)});layer++;if(layer<layers.length)next();else{state.busy=false;state.agentReq=state.req.id;state.flow={id:++state.flowCount,req:state.req.id,amount:state.req.amount,allocation:state.req.allocation};state.draftCode=source(1);state.checked=null;state.activeVersion=null;log('协作完成 · 生成 F'+state.flow.id+' 与 v1 代码草稿');render()}},650)}next()}

function workflow(){const n=nodes.find(x=>x[0]===state.selectedNode),params={data:['快照 SYN-202601','包含价格、成交额、可见时间'],filter:['3只合成股票','符合最低成交额的候选集'],signal:['过滤后的候选集','SYN-A 收盘示例信号'],size:['目标比例、现金、参考价格','以100股为单位的数量'],fill:['次日开盘、数量、5元费用','成交或资金不足拒绝事件'],metric:['成交、现金与期末价格','按日净值与累计收益']};return shell('策略处理流程','每个节点都连接参数、数据和对应的代码位置。',`<div class="panel"><div class="panelhead"><h2>量价策略 · 处理图</h2><span class="badge">${state.flow?'F'+state.flow.id:'待生成'} · 固定拓扑</span></div><div class="graph flowgraph">${nodes.map((x,i)=>`${i===3?'<div class="wide muted" style="font-size:11px;text-align:center">信号形成后 → 下一交易日执行<svg viewBox="0 0 600 30" width="100%" height="30" aria-label="信号连接到仓位计算"><path d="M550 0 V12 H50 V25" fill="none" stroke="currentColor"/><path d="M45 20 L50 27 L55 20" fill="none" stroke="currentColor"/></svg></div>':''}<button class="node ${state.selectedNode===x[0]?'selected':''}" data-node="${x[0]}"><span class="tag">0${i+1}</span><br><b>${x[1]}</b><small>${x[2]}</small></button>${i%3!==2?'<div class="arrow">→</div>':''}`).join('')}</div><div class="pad"><div class="guide">${current()?'流程已绑定当前需求。保存参数后，旧代码版本保持不变；新实验需要保存匹配的新版本。':'请先完成当前需求的 Agent 协作，再编辑流程。'}</div><div class="cols"><div class="field"><label for="flowAmount">最低成交额（万元）</label><input id="flowAmount" type="number" value="${state.flow?.amount??1000}"></div><div class="field"><label for="flowAllocation">投入比例（%）</label><input id="flowAllocation" type="number" value="${(state.flow?.allocation??1)*100}"></div></div><div class="row"><button id="saveFlow" ${!current()?'disabled':''}>保存流程新版本</button><button class="primary" onclick="go('code')" ${!current()?'disabled':''}>进入策略开发 →</button></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>节点检查器</h3><span class="tag">${n[0]}</span></div><div class="pad"><h2>${n[1]}</h2><div class="kv"><span>输入</span><span>${params[n[0]][0]}</span><span>输出</span><span>${params[n[0]][1]}</span><span>代码位置</span><span>strategy.py : ${n[3]}</span></div><button data-source-line="${n[3]}">定位源码行 ${n[3]}</button><p class="note">处理图描述策略逻辑；事件调试展示某次实验实际发生的输入与输出。</p></div></div>${sideDefault()}`)}
function saveFlow(){const amount=Number($('#flowAmount').value),allocation=Number($('#flowAllocation').value)/100;if(!Number.isFinite(amount)||amount<0||amount>10000||!Number.isFinite(allocation)||allocation<0.01||allocation>1){toast('请输入有效范围：成交额0～10000，投入比例1～100%');return}state.flow={id:++state.flowCount,req:state.req.id,amount,allocation};state.checked=null;log('保存流程 F'+state.flow.id+' · 代码需重新保存版本');render()}
function checkCode(){state.draftCode=$('#source').value;const variant=[1,2].find(x=>source(x)===state.draftCode);state.checked=variant?{source:state.draftCode,variant}:null;state.error=variant?'预置模型映射检查通过；Python未执行。':'此源码不匹配演示模型，无法运行。可保留编辑，或恢复预置示例。';log(state.error);render()}

function code(){return shell('策略开发','审阅生成的草稿，保存版本，再用事件证据驱动修复。',`<div class="panel"><div class="panelhead"><h2>strategy.py <span class="tag">Python 示意</span></h2><div class="row"><button class="compact" id="restoreCode">恢复预置 v1</button><button class="compact" id="checkCode">检查映射</button></div></div><div class="editor"><div class="lines">${Array.from({length:16},(_,i)=>i+1).join('\n')}</div><textarea id="source" spellcheck="false" aria-label="策略源码">${esc(state.draftCode)}</textarea></div><div class="pad"><div class="row"><span id="codeStatus" class="${state.checked?'badge':'tag'}">${state.checked?'映射检查通过':'草稿待检查'}</span><small>源码编辑使检查失效；只运行明确匹配的预置演示模型。</small></div><p class="note ${state.checked?'':'error'}" id="codeError">${esc(state.error)}</p><div class="row"><button id="saveVersion" ${!state.checked||!current()?'disabled':''}>保存代码版本</button><button class="primary" id="runExperiment" ${!canRun()?'disabled':''}>运行选中版本实验 →</button></div><p class="note">运行版本：${state.activeVersion?'v'+state.activeVersion.id+' / R'+state.activeVersion.req.id+' / F'+state.activeVersion.flow.id:'尚未保存'}。编辑草稿不会修改该版本。</p></div></div><div class="panel"><div class="panelhead"><h2>审查建议 · 成交资金约束</h2><span class="tag">待应用</span></div><div class="pad"><p class="note">次日开盘与前收盘不一致，且存在固定费用。把可买数量计算移到执行阶段。</p><div class="diff"><span class="minus">− quantity = int(budget / signal.close / 100) * 100</span>\n<span class="plus">+ quantity = int(max(0, budget - 5) / execution.open / 100) * 100</span></div><div class="row" style="margin-top:12px"><button id="applyFix">应用修复到草稿</button><small>应用后重新检查并保存，不覆盖旧版本。</small></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>代码版本</h3><span class="tag">${state.versions.length} 个</span></div>${state.versions.length?state.versions.map(v=>`<div class="version"><div><b>v${v.id} ${state.activeVersion?.id===v.id?'· 已选中':''}</b><br><small>R${v.req.id} / F${v.flow.id} · ${v.variant===1?'原始逻辑':'修复逻辑'}</small></div><div><button class="compact" data-version="${v.id}">选择</button><button class="compact" data-view-version="${v.id}">查看</button></div></div>`).join(''):'<div class="pad muted">保存后在此查看冻结版本。</div>'}</div>${sideDefault()}`)}
function canRun(){return current()&&state.activeVersion&&state.activeVersion.req.id===state.req.id&&state.activeVersion.flow.id===state.flow.id}
const fixture=[{symbol:'SYN-A',amount:2000,signal:true,close:10,open:10.1,marks:[10,10.4,10.8]},{symbol:'SYN-B',amount:1500,signal:false,close:20,open:20,marks:[20,20,20]},{symbol:'SYN-C',amount:500,signal:false,close:8,open:8,marks:[8,8,8]}];
function simulate(version){const v=copy(version),events=[],equity=[10000];let cash=10000,held=0,quantity=0,rejected=0;const emit=(date,symbol,node,input,output,status='完成')=>events.push({seq:events.length+1,date,symbol,node,visibleAt:date==='2026-01-05'?'2026-01-05 15:00':node==='metric'?date+' 15:00':date+' 09:30',line:nodes.find(n=>n[0]===node)[3],input,output,status});for(const stock of fixture){emit('2026-01-05',stock.symbol,'data',{snapshot:v.data},{close:stock.close,amount:stock.amount});const pass=stock.amount>=v.flow.amount;emit('2026-01-05',stock.symbol,'filter',{amount:stock.amount,min:v.flow.amount},{pass},pass?'通过':'过滤');if(pass)emit('2026-01-05',stock.symbol,'signal',{close:stock.close},{target:stock.signal},stock.signal?'形成目标':'无信号')}
const a=fixture[0];if(a.amount>=v.flow.amount){const budget=cash*v.flow.allocation;quantity=Math.floor((v.variant===1?budget/a.close:Math.max(0,budget-5)/a.open)/100)*100;emit('2026-01-06',a.symbol,'size',{cash,budget,referenceClose:a.close,executionOpen:a.open,fee:5},{quantity});const cost=quantity*a.open+(quantity?5:0);if(cost>cash){rejected++;emit('2026-01-06',a.symbol,'fill',{quantity,price:a.open,cost,cash},{reason:'资金不足',filled:0,cash},'拒绝')}else{held=quantity;cash=Math.round((cash-cost)*100)/100;emit('2026-01-06',a.symbol,'fill',{quantity,price:a.open,cost},{filled:held,cash},held?'成交':'无委托')}}
for(let i=1;i<3;i++){const value=Math.round((cash+held*a.marks[i])*100)/100;equity.push(value);emit('2026-01-0'+(5+i),'SYN-A','metric',{cash,held,close:a.marks[i]},{equity:value})}let peak=10000,drawdown=0;equity.forEach(x=>{peak=Math.max(peak,x);drawdown=Math.max(drawdown,(peak-x)/peak)});return {id:state.runs.length+1,version:v,events,equity,cash,held,rejected,quantity,final:equity.at(-1),returnPct:(equity.at(-1)/10000-1)*100,drawdownPct:drawdown*100,created:new Date().toISOString()}}
function runExperiment(){if(!canRun()){toast('当前版本与需求或流程不一致，请重新保存代码版本');return}const run=simulate(state.activeVersion);state.runs.push(run);state.selectedRun=state.runs.length-1;state.eventIndex=run.events.findIndex(e=>e.node==='fill');if(state.eventIndex<0)state.eventIndex=0;state.filters={date:'',symbol:'',node:''};log('实验 E'+run.id+' 完成 · v'+run.version.id+' · '+run.events.length+'条事件');go('debug')}
function visibleEvents(){const r=state.runs[state.selectedRun];return r?r.events.filter(e=>(!state.filters.date||e.date===state.filters.date)&&(!state.filters.symbol||e.symbol===state.filters.symbol)&&(!state.filters.node||e.node===state.filters.node)):[]}

function options(items,value){return '<option value="">全部</option>'+items.map(x=>`<option value="${esc(x[0]??x)}" ${(x[0]??x)===value?'selected':''}>${esc(x[1]??x)}</option>`).join('')}
function debug(){const r=state.runs[state.selectedRun];if(!r)return shell('事件调试','沿着真实演示事件，检查策略为何产生这个结果。','<div class="panel empty"><h2>还没有运行记录</h2><p>先保存一个策略版本，再运行固定样本实验。</p><button style="margin-top:15px" onclick="go(\'code\')">进入策略开发</button></div>');const event=r.events[state.eventIndex],events=visibleEvents();return shell('事件调试','从订单结果追溯到信号、仓位和当时可见的数据。',`<div class="panel"><div class="panelhead"><div class="row"><h2>实验 E${r.id}</h2><span class="tag">v${r.version.id} / R${r.version.req.id} / F${r.version.flow.id}</span></div><select id="runSelect" style="width:155px">${state.runs.map((x,i)=>`<option value="${i}" ${i===state.selectedRun?'selected':''}>E${x.id} · v${x.version.id}</option>`).join('')}</select></div><div class="trace">${nodes.map(n=>`<button class="${event?.node===n[0]?'active':''}" data-trace="${n[0]}">${n[1]} →</button>`).join('')}</div><div class="filterbar"><select id="dateFilter" aria-label="日期筛选">${options(['2026-01-05','2026-01-06','2026-01-07'].map(x=>[x,x]),state.filters.date)}</select><select id="symbolFilter" aria-label="股票筛选">${options(fixture.map(x=>[x.symbol,x.symbol]),state.filters.symbol)}</select><select id="nodeFilter" aria-label="节点筛选">${options(nodes.map(x=>[x[0],x[1]]),state.filters.node)}</select><button class="compact" id="resetFilters">清空</button></div><div class="tablewrap"><table><thead><tr><th>序号 / 日期</th><th>股票</th><th>节点</th><th>结果</th></tr></thead><tbody>${events.map(e=>`<tr data-event="${r.events.indexOf(e)}" class="${e===event?'selected':''}"><td>#${e.seq} <small>${e.date}</small></td><td>${e.symbol}</td><td>${nodes.find(n=>n[0]===e.node)[1]}</td><td class="${e.status==='拒绝'?'error':''}">${e.status}</td></tr>`).join('')||'<tr><td colspan="4">当前条件没有事件</td></tr>'}</tbody></table></div><div class="pad row"><button id="rewind">回到首条</button><button id="step">单步 →</button><button id="play">${state.playTimer?'暂停回放':'播放事件'}</button><span class="tag">事件 ${events.includes(event)?event.seq:'—'} / ${r.events.length}</span></div></div><div class="panel"><div class="panelhead"><h2>调试结论与下一步</h2><span class="tag">分析 Agent · 预设模板</span></div><div class="pad"><p>${r.rejected?'资金不足导致订单拒绝。检查仓位节点的参考价格，并在执行阶段计入费用。':r.held?'数量通过资金约束，成交和账户事件已生成。请与基线版本比较。':'本次没有持仓。检查筛选条件与投入比例。'}</p><p class="note">依据：E${r.id} 的仓位、成交及指标事件。结果由模拟器计算，分析文案来自模板。</p><div class="row"><button onclick="go('code')">查看代码与修复建议</button><button class="primary" onclick="go('experiments')">比较实验 →</button></div></div></div>`,`<div class="panel"><div class="panelhead"><h3>事件检查器</h3><span class="tag">${event&&events.includes(event)?'#'+event.seq:'无选择'}</span></div><div class="pad">${event&&events.includes(event)?`<h3>${event.symbol} · ${event.status}</h3><p class="note">可见时点 ${event.visibleAt}<br>来源：E${r.id} / v${r.version.id} / ${r.version.simulator}</p><small>输入</small><pre class="payload">${esc(JSON.stringify(event.input,null,2))}</pre><small>输出</small><pre class="payload">${esc(JSON.stringify(event.output,null,2))}</pre><button id="eventSource">查看冻结源码 : ${event.line}</button>`:'<p class="note">选择一条筛选后的事件。</p>'}</div></div><div class="panel pad"><h3>回放而非实时调试器</h3><p class="note">此处播放已完成实验的事件。原生工具后续接入断点与 worker 暂停协议。</p></div>`)}
function chart(){const runs=state.runs.slice(-2),vals=runs.flatMap(x=>x.equity),min=Math.min(10000,...vals)-50,max=Math.max(10100,...vals)+50,y=x=>190-(x-min)/(max-min)*150;return `<svg class="chart" viewBox="0 0 680 235" role="img" aria-label="最近两次实验净值曲线">${[0,1,2,3].map(i=>{let v=min+(max-min)*i/3;return `<line x1="62" y1="${y(v)}" x2="646" y2="${y(v)}"/><text x="5" y="${y(v)+4}">${v.toFixed(0)}</text>`}).join('')}${runs.map((r,i)=>`<polyline fill="none" stroke="${i?'#4b5bd0':'#8193b4'}" stroke-width="3" points="${r.equity.map((v,j)=>(75+j*280)+','+y(v)).join(' ')}"/>${r.equity.map((v,j)=>`<circle cx="${75+j*280}" cy="${y(v)}" r="4" fill="${i?'#4b5bd0':'#8193b4'}"/>`).join('')}`).join('')}<text x="62" y="220">01-05 信号</text><text x="310" y="220">01-06 执行</text><text x="572" y="220">01-07 期末</text></svg>`}
function divergence(){if(state.runs.length<2)return null;const [a,b]=state.runs.slice(-2);for(const e of a.events){const other=b.events.find(x=>x.date===e.date&&x.symbol===e.symbol&&x.node===e.node);if(!other||JSON.stringify(e.output)!==JSON.stringify(other.output))return {a,b,event:e,other}}return null}
function experiments(){if(!state.runs.length)return shell('回测实验','冻结输入，保存事件，用可复现结果比较策略版本。','<div class="panel empty"><h2>等待第一个实验</h2><p>运行代码版本后，净值与指标将在这里生成。</p><button style="margin-top:15px" onclick="go(\'code\')">进入策略开发</button></div>');const r=state.runs.at(-1),d=divergence();return shell('回测实验','对比最近两次实验，保留每次运行的完整版本和事件证据。',`<div class="stats"><div class="panel stat"><small>最新期末净值</small><strong>${money(r.final)}</strong><small>初始 10,000.00 元</small></div><div class="panel stat"><small>累计收益 · 合成样本</small><strong>${r.returnPct.toFixed(2)}%</strong><small>不年化 · 仅3个交易日</small></div><div class="panel stat"><small>成交 / 拒绝</small><strong>${r.held?1:0} / ${r.rejected}</strong><small>持仓 ${r.held} 股</small></div></div><div class="panel"><div class="panelhead"><h2>净值比较</h2><div class="row">${state.runs.slice(-2).map((x,i)=>`<small style="color:${i?'var(--accent)':'#8193b4'}">● E${x.id} / v${x.version.id}</small>`).join('')}</div></div><div class="pad">${chart()}<small>每个点来自冻结样本的账户计算；两次以上实验时显示最近两次。</small></div></div><div class="panel"><div class="panelhead"><h2>实验记录</h2><button id="exportExperiments">导出实验 JSON</button></div><div class="tablewrap"><table><thead><tr><th>实验 / 版本</th><th>需求 / 流程</th><th>收益</th><th>最大回撤</th><th>期末现金</th><th>操作</th></tr></thead><tbody>${state.runs.map(x=>`<tr><td>E${x.id} / v${x.version.id}</td><td>R${x.version.req.id} / F${x.version.flow.id}</td><td>${x.returnPct.toFixed(2)}%</td><td>${x.drawdownPct.toFixed(2)}%</td><td>${money(x.cash)}</td><td><button class="compact" data-debug-run="${x.id-1}">调试</button><button class="compact" data-manifest="${x.id-1}">快照</button></td></tr>`).join('')}</tbody></table></div></div>`,`<div class="panel"><div class="panelhead"><h3>首个分歧</h3><span class="badge">事件比对</span></div><div class="pad">${d?`<h3>${nodes.find(n=>n[0]===d.event.node)[1]}</h3><p class="note">${d.event.date} · ${d.event.symbol}</p><pre class="payload">E${d.a.id}: ${esc(JSON.stringify(d.event.output))}\nE${d.b.id}: ${esc(JSON.stringify(d.other?.output??'事件缺失'))}</pre><button id="jumpDivergence">定位首个分歧</button>`:state.runs.length<2?'<p class="note">完成修复并运行第二个版本后，这里会显示首个不同的事件输出。</p>':'<p class="note">最近两次实验输出一致。</p>'}</div></div><div class="panel pad"><h3>回测分析 Agent</h3><p class="note">模板读取 E${r.id}：${r.rejected?'存在资金不足拒绝。':r.held?'资金约束通过，已建立持仓。':'无持仓。'}收益 ${r.returnPct.toFixed(2)}%，由账户事件计算。</p><span class="tag">无真实模型调用</span><p class="note">这只能证明演示资金约束行为，不能证明策略具有市场收益能力。</p></div>`)}
function exportExperiments(){const data={kind:'AI研究工作台演示结果',disclaimer:'合成样本与预置模拟器，非真实A股回测',fixture,simulator:'1.0',runs:state.runs};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='研究项目-实验记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);log('导出实验、冻结源码、参数、数据样本与事件')}
function bind(){document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{state.selectedAgent=Number(b.dataset.agent);render()});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{state.selectedNode=b.dataset.node;render()});document.querySelectorAll('[data-source-line]').forEach(b=>b.onclick=()=>{go('code');const line=Number(b.dataset.sourceLine),el=$('#source'),start=el.value.split('\n').slice(0,line-1).join('\n').length+1;el.focus();el.setSelectionRange(start,start+el.value.split('\n')[line-1].length);toast('已定位 strategy.py 第'+line+'行')});const actions={confirmReq,startAgents,cancelAgents:()=>cancelAgents(),saveFlow,checkCode,saveVersion,runExperiment,restoreCode:()=>{state.draftCode=source(1);state.checked=null;state.error='已恢复预置草稿';render()},applyFix:()=>{state.draftCode=source(2);state.checked=null;state.error='修复已应用到草稿，请检查并保存新版本';log(state.error);render()},resetFilters:()=>{stopPlay();state.filters={date:'',symbol:'',node:''};render()},rewind:()=>{stopPlay();const es=visibleEvents();if(es.length)state.eventIndex=state.runs[state.selectedRun].events.indexOf(es[0]);render()},step,play:()=>{if(state.playTimer){stopPlay();render()}else{state.playTimer=setInterval(step,700);render()}},eventSource:()=>{const r=state.runs[state.selectedRun],e=r.events[state.eventIndex];modal('冻结源码 v'+r.version.id+' · 事件定位第'+e.line+'行',r.version.source.split('\n').map((x,i)=>(i+1===e.line?'▶ ':'  ')+String(i+1).padStart(2)+' '+x).join('\n'))},exportExperiments,jumpDivergence:()=>{const d=divergence();state.selectedRun=state.runs.indexOf(d.b);state.eventIndex=d.other?d.b.events.indexOf(d.other):0;state.filters={date:'',symbol:'',node:''};go('debug')}};for(const [id,fn] of Object.entries(actions))if($('#'+id))$('#'+id).onclick=fn;
if($('#reqText'))$('#reqText').oninput=e=>state.reqText=e.target.value;if($('#allocation'))$('#allocation').oninput=e=>state.draftAllocation=e.target.value;if($('#amount'))$('#amount').oninput=e=>state.draftAmount=e.target.value;
if($('#source'))$('#source').oninput=e=>{state.draftCode=e.target.value;state.checked=null;$('#saveVersion').disabled=true;$('#codeStatus').textContent='已修改 · 检查失效';$('#codeStatus').className='tag';$('#codeError').textContent='草稿未执行；运行按钮使用已保存的选中版本。'};
document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{state.activeVersion=state.versions.find(v=>v.id===Number(b.dataset.version));render()});document.querySelectorAll('[data-view-version]').forEach(b=>b.onclick=()=>{const v=state.versions.find(v=>v.id===Number(b.dataset.viewVersion));modal('只读代码 v'+v.id+' / R'+v.req.id+' / F'+v.flow.id,v.source)});
if($('#runSelect'))$('#runSelect').onchange=e=>{stopPlay();state.selectedRun=Number(e.target.value);state.eventIndex=0;state.filters={date:'',symbol:'',node:''};render()};for(const key of ['date','symbol','node'])if($('#'+key+'Filter'))$('#'+key+'Filter').onchange=e=>{stopPlay();state.filters[key]=e.target.value;const es=visibleEvents();state.eventIndex=es.length?state.runs[state.selectedRun].events.indexOf(es[0]):-1;render()};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{stopPlay();state.eventIndex=Number(b.dataset.event);render()});document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>{stopPlay();state.filters={date:'',symbol:'',node:b.dataset.trace};const es=visibleEvents();state.eventIndex=es.length?state.runs[state.selectedRun].events.indexOf(es[0]):-1;render()});document.querySelectorAll('[data-debug-run]').forEach(b=>b.onclick=()=>{state.selectedRun=Number(b.dataset.debugRun);state.eventIndex=0;state.filters={date:'',symbol:'',node:''};go('debug')});document.querySelectorAll('[data-manifest]').forEach(b=>b.onclick=()=>{const r=state.runs[Number(b.dataset.manifest)];modal('实验 E'+r.id+' 冻结清单',JSON.stringify(r.version,null,2))})}
function render(){$('#nav').innerHTML=Object.entries(pages).map(([k,v],i)=>`<button class="${state.page===k?'active':''}" data-nav="${k}" ${state.page===k?'aria-current="page"':''}><span class="num">0${i+1}</span>${v}</button>`).join('');$('#crumb').textContent=pages[state.page];$('#app').innerHTML=({requirements,agents,workflow,code,debug,experiments})[state.page]();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#logs').innerHTML=state.logs.slice(-3).map(x=>'<div>'+esc(x)+'</div>').join('');bind();const selected=$('tr[data-event].selected');if(selected){const container=selected.closest('.tablewrap'),delta=selected.getBoundingClientRect().top-container.getBoundingClientRect().top;if(delta>container.clientHeight-50)container.scrollTop+=delta-container.clientHeight/2}}
$('#theme').onclick=()=>document.body.classList.toggle('dark');window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(Object.hasOwn(pages,p)&&p!==state.page){stopPlay();state.page=p;render()}});render();
</script></body></html>
