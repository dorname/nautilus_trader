function updatePool(){document.getElementById('poolbadge').textContent='未保存的筛选条件';document.getElementById('poolbadge').className='badge gray';document.getElementById('poolrows').innerHTML=poolRows();document.getElementById('poolcount').textContent=filtered().length}
function download(){if(!state.planReady)return toast('请先重新生成计划');let csv='\ufeff说明,历史演示计划，非交易指令\n数据日期,2026-09-28\n代码,名称,参考价格,当前股数,目标股数,建议调整股数\n'+planRows().map(s=>[s.code,s.name,s.price,s.current,s.target,s.delta].join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='日序研究-演示计划-20260929.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出带演示标识的 CSV 计划')}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;render();return}const r=e.target.closest('[data-range]');if(r){state.range=r.dataset.range;render();return}const st=e.target.closest('[data-stock]');if(st){state.selected=st.dataset.stock;document.querySelectorAll('[data-stock]').forEach(x=>x.classList.toggle('selected',x.dataset.stock===state.selected));document.getElementById('stockdetail').innerHTML=detail();return}const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'theme':document.body.classList.toggle('dark');break;case'help':showModal('欢迎来到日序研究',`<p>这是面向 Windows / Linux 原生 Rust GUI 的高保真交互原型。你可以切换五个页面，筛选股票、编辑策略配置、运行或取消演示任务，并导出参考计划。</p><p><b>所有行情和曲线均为演示。</b>原型离线运行，不读取真实数据、不执行真实回测、不连接账户。刷新页面后重置状态。</p>`);break;case'method':showModal('让研究过程可以复现',`<p>正式应用将保存股票池、数据快照和策略参数，区分样本内与样本外，使用收盘后信号和下一交易日执行假设。</p><p>历史财务必须有公告时间；存在历史覆盖缺失时会明确限制严格回测。本原型只展示交互，不实现这些计算。</p>`);break;case'save-config':state.dirty=false;render();toast('配置已保存在本次演示会话，刷新后重置');break;case'save-pool':state.savedPool=true;render();toast(`本次演示已保存 ${filtered().length} 只股票的筛选结果`);break;case'reset-filter':state.query='';state.board='all';state.liquidity=0;render();break;case'run':startTask('run');break;case'update':startTask('data');break;case'cancel':clearInterval(timer);state.task=null;state.progress=0;render();document.getElementById('status').textContent='演示任务已取消 · 未生成新结果';toast('任务已取消，原有结果保持不变');break;case'snapshot':toast('演示快照已保存在本次会话，未写入真实数据库');break;case'import':showModal('日线导入流程',`<p>正式版将通过系统文件对话框选择本地通达信目录。本原型不访问文件，点击下方按钮演示处理过程。</p><div class="step"><span>1</span>选择数据目录<small>只读访问</small></div><div class="step"><span>2</span>解析日线与检查口径<small>分区校验</small></div><div class="step"><span>3</span>生成独立快照<small>保留来源</small></div>`,'demo-import','开始演示');break;case'demo-import':document.getElementById('modal').close();startTask('data');break;case'close-modal':document.getElementById('modal').close();break;case'holdings':showModal('编辑手工持仓',`<p>仅影响本次原型中的参考计划，不修改真实持仓。</p><label class="field"><span>参考总资产（CNY）</span><input id="capital" type="number" min="1000" max="100000000" value="${state.capital}"></label>${stocks.slice(0,5).map(s=>`<label class="field"><span>${s[1]} · 当前股数</span><input data-holding="${s[0]}" type="number" min="0" max="10000000" step="1" value="${state.holdings[s[0]]||0}"></label>`).join('')}`,'save-holdings','保存并生成计划');break;case'save-holdings':{let capital=Number(document.getElementById('capital').value);let fields=[...document.querySelectorAll('[data-holding]')];if(!Number.isFinite(capital)||capital<1000||capital>1e8||fields.some(x=>!Number.isInteger(Number(x.value))||Number(x.value)<0||Number(x.value)>1e7))return toast('请输入有效总资产与非负整数持仓');state.capital=capital;fields.forEach(x=>state.holdings[x.dataset.holding]=Number(x.value));state.planReady=true;document.getElementById('modal').close();render();toast('手工持仓已更新，参考股数已重新计算');break}case'generate':state.planReady=true;render();toast('演示参考计划已根据手工持仓重新生成');break;case'export':download();break;case'plan-note':case'stock-note':showModal('添加研究备注',`<p>备注仅保存在本次演示界面。</p><label class="field"><span>备注内容</span><input id="note" maxlength="200" placeholder="例如：继续观察，暂不调整"></label>`,'save-note','保存备注');break;case'save-note':{const v=document.getElementById('note').value.trim();if(!v)return toast('请先输入备注');document.getElementById('modal').close();if(document.getElementById('notepreview'))document.getElementById('notepreview').textContent=v;toast('备注已添加至本次演示');break}}});
document.addEventListener('input',e=>{if(e.target.id==='stocksearch'){state.query=e.target.value;state.savedPool=false;updatePool()}});
document.addEventListener('change',e=>{if(e.target.dataset.config){const k=e.target.dataset.config;state[k]=['window','skip','top'].includes(k)?Number(e.target.value):e.target.value;state.dirty=true;render()}if(e.target.id==='board'){state.board=e.target.value;state.savedPool=false;updatePool()}if(e.target.id==='liquidity'){state.liquidity=Number(e.target.value);state.savedPool=false;updatePool()}if(e.target.id==='comparealt'){state.compareAlt=e.target.checked;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-stock]'))e.target.click()});
document.addEventListener('mousemove',e=>{const box=e.target.closest('[data-chart]');if(!box)return;const rect=box.getBoundingClientRect(),arr=box.dataset.chart.split(','),i=Math.max(0,Math.min(arr.length-1,Math.round((e.clientX-rect.left)/rect.width*(arr.length-1))));const tip=box.querySelector('.charttip');tip.textContent=`演示区间 ${Math.round(i/(arr.length-1)*100)}% · 净值 ${arr[i]}`;tip.style.left=Math.min(rect.width-195,Math.max(5,e.clientX-rect.left+12))+'px';tip.style.top='35px'});
render();
</script>
</body></html>
