<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>研序 · 策略研究工作区</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--glass:rgba(28,28,30,.55);--glass-soft:rgba(40,40,42,.35);--glass-strong:rgba(20,20,22,.78);--accent:#22c55e;--accent-strong:#16a34a;--accent-text:#4ade80;--accent-soft:rgba(34,197,94,.08);--accent-border:rgba(34,197,94,.24);--accent-glow:rgba(34,197,94,.45);--cyan-text:#67e8f9;--amber-text:#fbbf24;--red-text:#f87171;--text:#fafafa;--text2:#d4d4d8;--muted:#a1a1aa;--faint:#71717a;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);--line:rgba(255,255,255,.08);--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;--radius:14px;font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px}
*{box-sizing:border-box}
::selection{background:rgba(34,197,94,.3);color:#fff}
body{margin:0;color:var(--text);background-color:var(--bg);background-image:radial-gradient(ellipse 60% 50% at 15% 0%,rgba(34,197,94,.13),transparent 60%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(6,182,212,.11),transparent 55%);background-attachment:fixed}
button,input,textarea,select{font:inherit}
button{cursor:pointer;background:rgba(255,255,255,.03);border:1px solid var(--border-strong);color:var(--text2);border-radius:7px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;font-size:12px}
button:hover{background:rgba(255,255,255,.06);color:var(--text);border-color:rgba(255,255,255,.18)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.primary{background:var(--accent);color:#000;border-color:transparent;font-weight:600}
button.primary:hover{background:var(--accent-strong);color:#000}
button.small{padding:5px 8px;font-size:11px}
button.ghost{border-color:transparent;color:var(--muted)}
button.wide{width:100%}
input,textarea,select{width:100%;background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--border-strong);border-radius:7px;padding:10px;outline:none;min-width:0}
textarea{resize:vertical;line-height:1.85;min-height:112px}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=number]{font-variant-numeric:tabular-nums}
label{display:block;color:var(--text2);font-size:12px;margin-bottom:7px}
h1,h2,h3,p{margin:0}
h1{font-size:24px;letter-spacing:-.8px;font-weight:580}
h2{font-size:15px;font-weight:560}
h3{font-size:13px;font-weight:550}
p{line-height:1.85}
small,.muted{color:var(--muted);font-size:11px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
a{color:var(--accent-text)}
.app{height:100dvh;display:grid;grid-template-columns:212px minmax(0,1fr);gap:12px;padding:12px}
.sidebar{border:1px solid var(--border);border-radius:16px;background:var(--glass);backdrop-filter:blur(28px) saturate(160%);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 32px rgba(0,0,0,.4);display:flex;flex-direction:column;min-height:0;padding:22px 14px 16px;gap:20px}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px;font-size:20px;letter-spacing:3px}
.brand-mark{width:29px;height:29px;display:grid;place-items:center;background:linear-gradient(145deg,#4ade80,#16a34a);color:#03130a;border-radius:9px;font-size:19px;letter-spacing:0;box-shadow:0 0 14px rgba(34,197,94,.35)}
.brand small{letter-spacing:1px;font-size:9px;display:block;margin-top:4px}
.project-selector{font-size:11px;padding:10px 7px;background:rgba(0,0,0,.35)}
.section-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 10px;margin-bottom:10px}
.nav{display:grid;gap:3px}
.nav button{border:1px solid transparent;background:transparent;justify-content:flex-start;padding:9px 11px;color:var(--muted);font-size:12px;white-space:nowrap;position:relative;border-radius:7px}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.active{background:var(--accent-soft);border-color:var(--accent-border);color:var(--text)}
.nav button.active:before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:2px;height:18px;background:var(--accent);border-radius:0 2px 2px 0;box-shadow:0 0 10px var(--accent-glow)}
.nav button.active svg{color:var(--accent-text)}
.nav button .count{margin-left:auto;color:var(--faint);font-size:10px;font-family:var(--mono)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--border);padding-top:16px;display:flex;gap:8px;align-items:center}
.avatar{width:27px;height:27px;border:1px solid var(--border-strong);border-radius:50%;display:grid;place-items:center;color:var(--text2);background:rgba(255,255,255,.05);font-size:10px}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:65px 1fr 28px;border:1px solid var(--border);border-radius:16px;background:rgba(15,15,17,.5);backdrop-filter:blur(24px) saturate(180%);overflow:hidden}
.topbar{border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);display:flex;justify-content:space-between;align-items:center;padding:0 25px;gap:10px}
.crumb{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
.crumb b{font-weight:500;color:var(--text2)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border-strong);border-radius:5px;padding:4px 7px;color:var(--muted);background:rgba(255,255,255,.05);line-height:1.3;white-space:nowrap}
.tag.purple{color:var(--accent-text);background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.28)}
.tag.warn{color:var(--amber-text);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.28)}
.tag.bad{color:var(--red-text);background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.28)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);display:inline-block}
.body{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0;min-width:0}
.chat{display:flex;flex-direction:column;border-left:1px solid var(--border);min-height:0;background:rgba(20,20,22,.35);backdrop-filter:blur(22px) saturate(150%)}
.chat-heading{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px}
.assistant-logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--accent-text);background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2)}
.messages{overflow-y:auto;flex:1;padding:6px 22px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.message{margin:17px 0 23px;animation:appear .2s ease}
.msg-meta{font-size:10px;color:var(--faint);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.message.user{display:flex;flex-direction:column;align-items:flex-end}
.message.user .msg-body{border:1px solid var(--border);background:var(--glass-soft);backdrop-filter:blur(16px);border-radius:10px 10px 2px 10px;padding:10px 13px;color:var(--text2);font-size:12px;max-width:92%}
.msg-body{font-size:12px;line-height:1.9;color:var(--text2);white-space:pre-wrap;overflow-wrap:anywhere}
.message.assistant .msg-meta{color:var(--accent-text)}
.artifact-card{margin-top:12px;width:100%;padding:13px;text-align:left;justify-content:flex-start;background:linear-gradient(130deg,rgba(34,197,94,.1),rgba(255,255,255,.02));border-color:rgba(34,197,94,.22);border-radius:9px}
.artifact-card:hover{border-color:rgba(34,197,94,.4)}
.artifact-card span{flex:1}
.artifact-card b{font-size:12px;font-weight:500;display:block;margin-bottom:5px}
.artifact-card small{font-size:10px}
.taskbar{margin:0 20px 10px;padding:10px 12px;border-radius:8px;border:1px solid rgba(34,197,94,.2);background:rgba(34,197,94,.06);display:flex;align-items:center;gap:8px;font-size:11px}
.taskbar span{flex:1}
.composer{padding:0 18px 15px}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.suggestions button{font-size:10px;padding:5px 8px;color:var(--muted)}
.compose-box{border:1px solid rgba(34,197,94,.3);border-radius:12px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);box-shadow:0 10px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);padding:11px}
.compose-box textarea{border:0;resize:none;min-height:64px;height:64px;padding:0;background:transparent;font-size:12px;line-height:1.8}
.compose-foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.compose-foot small{font-size:9px}
.send{padding:7px!important}
.disclaimer{text-align:center;font-size:9px;color:var(--faint);margin-top:8px}
.workspace{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.workspace-head{display:flex;align-items:center;justify-content:space-between;padding:17px 23px 10px;gap:8px}
.workspace-head h2{font-size:12px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:8px}
.canvas{padding:25px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:23px}
.eyebrow{font-family:var(--mono);color:var(--faint);letter-spacing:.12em;text-transform:uppercase;font-size:9px;margin-bottom:10px}
.subtitle{color:var(--muted);font-size:11px;line-height:1.8;margin-top:8px}
.panel{border:1px solid var(--border);border-radius:var(--radius);background:var(--glass);backdrop-filter:blur(28px) saturate(160%);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 32px rgba(0,0,0,.4);margin-bottom:15px;overflow:hidden}
.pad{padding:19px}
.panel-head{padding:15px 19px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:10px}
.panel-head h3{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.note{font-size:11px;color:var(--muted);line-height:1.9;margin-top:12px}
.banner{padding:12px 14px;border:1px solid rgba(245,158,11,.25);border-radius:8px;color:var(--amber-text);font-size:11px;line-height:1.8;background:rgba(245,158,11,.06);margin-bottom:16px}
.hero{min-height:170px;padding:24px;background:radial-gradient(ellipse at 88% 0%,rgba(34,197,94,.13),transparent 60%),linear-gradient(110deg,#0f1512,#0a0b0a);position:relative}
.hero h2{font-size:20px;line-height:1.6;font-weight:500;margin:12px 0 8px;max-width:380px}
.hero p{font-size:12px;color:var(--muted);max-width:380px}
.hero-orbit{position:absolute;right:20px;top:30px;width:110px;height:110px;opacity:.5;pointer-events:none}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}
.metric{padding:17px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);backdrop-filter:blur(10px)}
.metric strong{display:block;font-family:var(--mono);font-size:23px;font-weight:500;letter-spacing:-.7px;margin:10px 0 5px;font-variant-numeric:tabular-nums}
.metric small{font-size:10px}
.journey-row{display:flex;align-items:center;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border);width:100%;border-radius:0;justify-content:flex-start;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.journey-row:hover{background:rgba(255,255,255,.03)}
.journey-row:last-child{border-bottom:0}
.step-num{font-family:var(--mono);font-size:10px;color:var(--accent-text);border:1px solid rgba(34,197,94,.25);border-radius:50%;width:25px;height:25px;display:grid;place-items:center;flex:none}
.journey-row .details{flex:1}
.journey-row b{font-weight:500;font-size:12px}
.journey-row small{display:block;margin-top:5px;font-size:10px}
.empty{text-align:center;padding:42px 22px}
.empty .icon{width:30px;height:30px;margin-bottom:15px;color:#3d5c4a}
.empty p{color:var(--muted);font-size:12px;margin:12px auto 19px;max-width:400px}
.footer{border-top:1px solid var(--border);background:rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:9px;color:var(--faint);gap:10px}
.footer span{white-space:nowrap}
.table-wrap{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}
th{color:var(--faint);background:rgba(255,255,255,.02);font-weight:450;text-align:left;padding:12px}
td{padding:13px 12px;border-top:1px solid var(--border);color:var(--text2);font-variant-numeric:tabular-nums}
tr.selected{background:rgba(34,197,94,.07)}
.clickable{cursor:pointer}
.kv{display:grid;grid-template-columns:105px minmax(0,1fr);gap:11px;font-size:11px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;overflow-wrap:anywhere}
.code{font:11px/1.9 var(--mono);tab-size:4;white-space:pre;min-height:310px;border:0;border-radius:0;padding:18px;color:#d4e8da;background:#0a0c0a;resize:vertical;overflow:auto}
.code-label{font-size:10px;color:var(--muted);display:flex;gap:8px;align-items:center}
.code-pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.8 var(--mono);color:var(--text2);background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:8px;padding:14px;margin:10px 0}
.diff{border-left:2px solid var(--accent);padding:12px;background:rgba(34,197,94,.06);white-space:pre-wrap;font:11px/1.8 var(--mono)}
.chart{width:100%;height:auto;display:block}
.chart text,.diagram text{fill:var(--faint);font:10px system-ui}
.chart line{stroke:rgba(255,255,255,.07)}
.diagram{width:100%;display:block}
.diagram rect{fill:#141816;stroke:#243b2e}
.diagram line,.diagram path{stroke:#2f5240;fill:none}
.diagram text{fill:#b8cfc0;font-size:11px}
.diagram .node{cursor:pointer}
.diagram .node:hover rect{stroke:var(--accent-text);fill:#16241b}
.diagram .node.active rect{stroke:var(--accent)}
.status-list{list-style:none;padding:0;margin:0}
.status-list li{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);font-size:11px}
.status-list li:last-child{border:0}
.success{color:var(--accent-text)}
.error{color:var(--red-text)}
.evidence-link{font-size:10px;color:var(--accent-text);margin-top:6px}
.concepts{font-size:11px;line-height:1.9;color:var(--muted)}
.concepts b{color:var(--text2);font-weight:500}
.toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);padding:12px 20px;border:1px solid rgba(34,197,94,.35);background:var(--glass-strong);backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(0,0,0,.55);border-radius:9px;z-index:10;max-width:80vw;font-size:12px;display:none}
.toast.show{display:block}
dialog{background:rgba(18,20,18,.9);backdrop-filter:blur(28px) saturate(160%);color:var(--text);border:1px solid var(--border-strong);border-radius:14px;padding:24px;width:min(660px,90vw);max-height:85vh;box-shadow:0 30px 100px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
dialog h2{margin-bottom:15px}
dialog pre{max-height:55vh;overflow:auto}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.focus .body{grid-template-columns:minmax(0,1fr)}
.focus .chat{display:none}
.focus .canvas{max-width:1120px;width:100%;margin:0 auto}
.task-spin{width:10px;height:10px;border-radius:50%;border:1px solid rgba(34,197,94,.3);border-top-color:var(--accent-text);animation:spin 1s linear infinite}
.form-error{font-size:11px;color:var(--red-text);margin-top:12px}
.divider{height:1px;background:var(--border);margin:17px 0}
.search-row{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:16px}
.trace{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.trace button{font-size:10px;padding:6px 9px}
.trace button.active{border-color:rgba(34,197,94,.4);color:var(--accent-text)}
.history{display:flex;flex-direction:column;gap:8px}
.history button{justify-content:space-between;text-align:left}
.plan-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan-inputs label{font-size:10px}
.plan-inputs input{padding:8px}
.no-margin{margin:0}
.space-top{margin-top:15px}
.intro-line{font-size:11px;color:var(--faint);text-align:center;margin:10px 0 25px}
.hint{color:var(--faint);font-size:10px;line-height:1.8}
.muted-button{color:var(--muted)}
.splash{padding:50px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes appear{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(max-width:1200px){.app{grid-template-columns:178px 1fr}.body{grid-template-columns:minmax(0,1fr) 320px}.sidebar{padding:22px 10px}.canvas{padding:20px}.topbar{padding:0 18px}.hero-orbit{width:70px;right:12px;opacity:.3}.hero h2{font-size:18px}.grid2{grid-template-columns:1fr}.metric{padding:12px}.metric strong{font-size:20px}.chat-heading{padding:18px}.messages{padding:6px 18px}.workspace-head{padding:17px 18px 10px}.plan-inputs{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.app{grid-template-columns:65px 1fr}.brand{padding:0;justify-content:center}.brand-name,.sidebar .section-label,.sidebar .nav-label,.sidebar .count,.sidebar-bottom .profile,.sidebar .project-controls{display:none}.sidebar{padding:20px 8px}.nav button{justify-content:center;padding:12px 5px}.nav button.active:before{left:4px}.sidebar-bottom{justify-content:center}.body{grid-template-columns:minmax(0,1fr) 280px}.topbar .tag{display:none}.metric-grid{grid-template-columns:1fr}.metric{display:none}.metric:first-child{display:block}.canvas{padding:14px}.hero{padding:18px}.page-title h1{font-size:20px}.footer span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="root">
<aside class="sidebar">
<div class="brand"><span class="brand-mark">研</span><span class="brand-name">研序<small>策略研究工作区</small></span></div>
<div class="project-controls"><label for="projectSelect" class="section-label">当前项目</label><select id="projectSelect" class="project-selector"></select><button class="ghost small wide space-top" id="newProject">＋ 新建研究项目</button></div>
<div><div class="section-label">研究工作区</div><nav class="nav" id="nav"></nav></div>
<div><div class="section-label">研究资源</div><nav class="nav" id="resourceNav"></nav></div>
<div class="sidebar-bottom"><span class="avatar">本地</span><div class="profile"><div style="font-size:11px">个人研究空间</div><small style="font-size:9px">离线 · 无自动下单</small></div></div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb"><span>研究项目</span><span>/</span><b id="projectName"></b></div><div class="row"><span class="tag purple"><i class="dot"></i> 演示环境</span><button class="ghost small" id="showEvidence">运行记录</button></div></header>
<div class="body">
<section class="workspace" aria-label="研究产物工作区"><div class="workspace-head"><h2><span>◇</span> 项目产物 <span id="versionTag" class="tag"></span></h2><button class="ghost small" id="focusToggle" aria-pressed="false">展开工作区 ⤢</button></div><div class="canvas" id="canvas"><p class="splash">正在打开研究工作区…</p></div></section>
<section class="chat" aria-label="研究对话">
<div class="chat-heading"><div class="row"><span class="assistant-logo">✧</span><div><h3>研究助手</h3><small style="font-size:9px">从一个想法，到可追溯的计划</small></div></div><span class="tag">预设对话</span></div>
<div class="messages" id="messages" aria-live="polite"></div>
<div id="taskSlot"></div>
<div class="composer"><div class="suggestions" id="suggestions"></div><form id="chatForm" class="compose-box"><textarea id="chatInput" aria-label="对研究助手说" placeholder="描述你的研究想法，或让助手解释当前结果…"></textarea><div class="compose-foot"><small>↵ 发送 · Shift + ↵ 换行</small><button class="primary send" type="submit" aria-label="发送消息">↑</button></div></form><div class="disclaimer">离线预设交互 · 计算来自合成样本 · 未接入模型</div></div>
</section>
</div>

 else{try{fn(q);q.retry=null}catch(e){tell(label+'失败：'+e.message,null,null,null,q)}}

function confirmReq(){const q=p();if(!q.reqText.trim()||!q.acceptance.trim())return error('请填写研究目标与验收标准');if(!Number.isFinite(+q.allocation)||q.allocation<0||q.allocation>100||!Number.isFinite(+q.minAmount)||q.minAmount<0)return error('投入比例须为 0～100%，成交额须为非负数');const req={id:q.reqs.length+1,text:q.reqText,acceptance:q.acceptance,allocation:+q.allocation,minAmount:+q.minAmount};if(q.req&&JSON.stringify({...q.req,id:0})===JSON.stringify({...req,id:0}))return toast('内容未改变，继续使用 R'+q.req.id);q.req=clone(req);q.reqs.push(clone(req));q.designAllocation=req.allocation;q.designAmount=req.minAmount;markChanged(q);tell('需求 R'+req.id+' 已确认。下一步生成设计说明与两张处理图。旧实验保留，新研究将使用此需求版本。','design','生成策略设计','需求 R'+req.id+' · 等待设计');render()}
function generateDesign(){if(!p().req)return error('请先确认需求文档');startTask('生成策略设计',q=>{q.designAllocation=q.req.allocation;q.designAmount=q.req.minAmount;q.designNote='按需求 R'+q.req.id+'：'+q.req.text+'\n\n处理顺序：可见数据 → 股票池过滤 → 信号形成 → 仓位 → 模拟成交 → 指标。信号日与执行日分离。';q.page='design';tell('设计草稿已生成。两张图共用六个处理节点，请检查参数和说明后保存设计版本。','design','设计草稿与处理图','等待保存设计版本',q)})}

function compute(v){const events=[],equity=[10000];let cash=10000,held=0,rejected=0;
 const add=(node,symbol,status,input,output,line,date='2026-01-06')=>events.push({seq:events.length+1,node,symbol,status,input,output,line,date,visibleAt:date==='2026-01-05'?'2026-01-05 15:00':node==='metric'?date+' 15:00':date+' 09:30'});
 add('data','全部','已读取',{snapshot:v.data.id},{visibleThrough:'2026-01-05 15:00',count:3},3,'2026-01-05');
 for(const s of v.data.fixture){const inPool=v.pool.symbols.includes(s.symbol)&&s.amount>=v.design.minAmount;add('filter',s.symbol,inPool?'入选':'排除',{amount:s.amount,threshold:v.design.minAmount,pool:v.pool.id},{included:inPool},4,'2026-01-05');if(!inPool)continue;add('signal',s.symbol,s.signal?'形成信号':'无信号',{close:s.close},{signal:s.signal},5,'2026-01-05');if(!s.signal||s.symbol!=='SYN-A')continue;
 const quantity=Math.max(0,Math.floor((cash*v.design.allocation-(v.variant===2?5:0))/(v.variant===2?s.open:s.close)/100)*100),cost=quantity*s.open+(quantity?5:0);
 add('size',s.symbol,'计算完成',{cash,allocation:v.design.allocation,reference:v.variant===2?s.open:s.close,fee:5},{quantity,cost},8);
 if(cost>cash){rejected++;add('fill',s.symbol,'资金不足 · 拒绝',{quantity,price:s.open,cash},{accepted:false,required:cost,cash,held:0},10)}else{cash=Math.round((cash-cost)*100)/100;held=quantity;add('fill',s.symbol,quantity?'已成交':'无需成交',{quantity,price:s.open},{accepted:true,cash,held},10)}
 }
 for(let i=1;i<3;i++){const value=+(cash+held*v.data.fixture[0].marks[i]).toFixed(2);equity.push(value);add('metric','账户','已估值',{cash,held,close:v.data.fixture[0].marks[i]},{equity:value},11,'2026-01-0'+(5+i))}
 let peak=equity[0],dd=0;for(const e of equity){peak=Math.max(peak,e);dd=Math.max(dd,(peak-e)/peak*100)}
 return {version:clone(v),events,equity,cash,held,rejected,final:equity.at(-1),returnPct:(equity.at(-1)/10000-1)*100,drawdownPct:dd};
}
function runExperiment(){const q=p(),v=active(q);if(!fresh(v,q))return error('版本未保存或上游已过期，请保存当前版本后再运行');const frozen=clone(v);startTask('运行合成样本实验',q=>{const run={id:q.runs.length+1,...compute(frozen)};q.runs.push(run);q.runIndex=q.runs.length-1;q.eventIndex=0;q.nodeFilter='';q.page='experiments';q.report=null;tell('实验 E'+run.id+' 完成：期末净值 '+money(run.final)+'，收益 '+run.returnPct.toFixed(2)+'%。'+(run.rejected?'订单因资金不足被拒绝，可进入事件调试定位。':'计算结果已保存，接下来检查验证证据。'),'experiments','实验 E'+run.id+' · v'+run.version.id,'合成样本计算结果',q)})}
function makeReport(){const q=p(),v=active(q);if(!fresh(v,q))return error('当前版本已过期或不存在，请更新版本并运行');const run=q.runs.findLast(r=>r.version.id===v.id&&r.version.stamp===v.stamp);if(!run)return error('当前版本尚无实验，不能生成验证结论');const checks=[{name:'版本与冻结输入一致',pass:fresh(v,q),detail:'R'+v.req.id+' / D'+v.design.id+' / '+v.data.id+' / '+v.pool.id},{name:'信号早于执行时点',pass:run.events.filter(e=>e.node==='signal').every(e=>e.date==='2026-01-05'),detail:'信号日 01-05；执行日 01-06'},{name:'资金约束与拒绝检查',pass:run.rejected===0&&run.cash>=0,detail:run.rejected?'存在 '+run.rejected+' 笔资金不足拒绝':'现金 '+money(run.cash)+'；无资金不足拒绝'},{name:'样本范围已披露',pass:true,detail:'3 个合成标的、3 个日期，不代表真实市场'}];q.report={version:v.id,run:run.id,stamp:stamp(q),demo:checks.every(c=>c.pass)?'通过':'失败',formal:'证据不足',checks};q.page='validate';tell('验证报告已生成：演示检查'+q.report.demo+'；正式策略验证仍为证据不足。真实数据、样本外与参数稳健性未运行。'+(q.report.demo==='通过'?'可以继续演示计划生成与账户核对。':'请修复问题并运行新版本。'),'validate','验证报告 · v'+v.id,'关联实验 E'+run.id);render()}
function planInputValid(q=p()){const i=q.planInput;return Number.isFinite(+i.cash)&&i.cash>=0&&i.cash<=1e8&&i.holdings.every(x=>Number.isInteger(+x)&&x>=0&&x<=1e7)&&i.sellable.every((x,j)=>Number.isInteger(+x)&&x>=0&&x<=i.holdings[j])}

function makePlan(){const q=p();if(!reportReady(q))return error('请先让当前版本完成演示检查；正式交易验证仍未完成');if(!planInputValid(q))return error('现金须非负，持仓与可卖须为非负整数，且可卖不超过持仓');const v=active(q),i=clone(q.planInput),prices=fixture.map(x=>x.plan),total=+i.cash+i.holdings.reduce((a,n,j)=>a+n*prices[j],0),budget=total*v.design.allocation;
 const hasSignal=v.pool.symbols.includes('SYN-A')&&fixture[0].amount>=v.design.minAmount;
 let target=hasSignal?Math.max(0,Math.floor(budget/prices[0]/100)*100):0;
 if(target>i.holdings[0]&&target*prices[0]+5>budget)target=Math.max(0,target-100);
 const rows=fixture.map((s,j)=>({symbol:s.symbol,price:prices[j],current:i.holdings[j],sellable:i.sellable[j],target:j===0?target:0,delta:(j===0?target:0)-i.holdings[j]}));
 q.plan={id:Date.now(),version:clone(v),input:i,total,budget,rows,signature:planSignature(q),checked:false,issues:[],buys:rows.reduce((a,x)=>a+(x.delta>0?x.delta*x.price+5:0),0)};tell('演示计划草稿已生成，使用独立的 01-08 合成参考快照。请核对可卖数量、买入费用和数据有效期后确认导出。','plan','交易计划草稿','尚未核对');render()}
function planIssues(q=p()){const t=q.plan;if(!t)return ['尚未生成计划'];const errors=[];if(!reportReady(q))errors.push('策略版本或验证报告已过期');if(t.signature!==planSignature(q))errors.push('账户或数据输入已改变，请重新生成计划');if(t.input.snapshot!=='PLAN-20260108'||t.input.date!=='2026-01-09')errors.push('快照与计划交易日不匹配，演示仅支持 01-08 → 01-09');if(t.buys>t.input.cash)errors.push('可用现金不足，买入合计含费 '+money(t.buys));for(const row of t.rows){if(row.delta<0&&-row.delta>row.sellable)errors.push(row.symbol+' 可卖数量不足');if(row.delta>0&&row.delta%100!==0)errors.push(row.symbol+' 买入数量不是 100 股整数倍')}return errors}
function checkPlan(){const q=p();if(!q.plan)return error('请先生成计划');q.plan.issues=planIssues(q);q.plan.checked=!q.plan.issues.length;record('计划核对'+(q.plan.checked?'通过':'失败'));render();toast(q.plan.checked?'演示计划约束核对通过，请确认后导出':q.plan.issues.join('；'))}
function exportPlan(){const q=p();if(!q.plan?.checked||planIssues(q).length)return error('计划未核对或已过期，请重新生成并核对');modal('确认导出演示计划',`<p class="note">计划绑定策略 v${q.plan.version.id}，交易日 ${esc(q.plan.input.date)}。正式策略验证仍为证据不足；本文件仅用于演示人工核对流程，不是实际交易指令。</p>`,btn('返回','closeDialog')+btn('确认并导出演示 CSV','confirmExport','primary'))}
function confirmExport(){const q=p(),t=q.plan;if(!t?.checked||planIssues(q).length){$('#dialog').close();return error('确认期间输入已改变，已阻止导出')}const rows=[['说明','演示计划，非交易指令，不自动下单'],['项目',q.name],['计划编号',t.id],['生成时间',new Date(t.id).toISOString()],['研究数据快照',t.version.data.id],['股票池',t.version.pool.id],['版本','v'+t.version.id,'R'+t.version.req.id,'D'+t.version.design.id],['计划快照',t.input.snapshot],['交易日期',t.input.date],['正式验证','证据不足'],['现金',t.input.cash],['代码','参考价','当前股数','可卖股数','目标股数','调整股数'],...t.rows.map(x=>[x.symbol,x.price,x.current,x.sellable,x.target,x.delta])];const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+(typeof x==='string'&&/^[=+\-@]/.test(x)?"'"+x:String(x)).replace(/"/g,'""')+'"').join(',')).join('\n');download('研序-演示交易计划.csv',csv,'text/csv;charset=utf-8');$('#dialog').close();tell('演示计划已导出。文件包含策略版本、独立计划快照、账户数量和演示标识；没有发送任何订单。','plan','已导出演示计划','供人工阅读');render()}
function nextStep(q=p()){
 const v=active(q), step=(label,route,reason)=>({label,route,reason});
 if(q.task)return step('等待任务完成',q.page,q.task.label+'正在执行，可在对话区取消');
 if(!q.req)return step('确认研究需求','requirements','先确认研究目标与验收标准');
 if(!q.design||q.design.req!==q.req.id)return step('保存当前设计','design','设计缺失或引用旧需求，请同步后保存');
 if(!fresh(v,q))return step('保存当前策略版本','develop','策略尚未保存或上游已变化，请检查并冻结新版本');
 const run=q.runs.findLast(r=>r.version.id===v.id&&r.version.stamp===v.stamp);
 if(!run)return step('运行合成实验','experiments','当前 v'+v.id+' 尚无实验；历史实验不代替当前证据');
 if(!q.report||q.report.version!==v.id||q.report.stamp!==stamp(q))return step('生成验证报告','validate','当前实验 E'+run.id+' 已完成，等待证据检查');
 if(q.report.demo!=='通过')return step('排查失败证据','validate','演示检查失败，从报告打开关联实验定位原因');
 if(!q.plan||q.plan.signature!==planSignature(q))return step('生成演示计划','plan','当前演示检查通过，请使用独立账户和计划快照生成草稿');
 const issues=planIssues(q);
 if(!q.plan.checked||issues.length)return step('核对交易计划','plan',issues.join('；')||'草稿尚未核对现金、可卖数量与数据时效');
 return step('确认导出演示清单','plan','计划核对通过；正式策略验证仍为证据不足');
}

}

}

}
function updateData(){startTask('模拟更新数据快照',q=>{q.dataRevision++;markChanged(q);tell('新合成快照 SYN-202601-r'+q.dataRevision+' 已建立。当前版本和结论需要重新确认，历史实验不变。','data','数据快照已更新','原型更新，不连接行情服务',q)})}
function savePool(){const q=p();if(!Number.isFinite(+q.poolAmount)||q.poolAmount<0)return error('最低成交额须为非负数');q.pool=fixture.filter(s=>s.amount>=q.poolAmount&&(q.poolMarket==='全部'||s.market===q.poolMarket)).map(s=>s.symbol);q.poolRevision++;markChanged(q);tell('股票池 U'+q.poolRevision+' 已保存，共 '+q.pool.length+' 个样本。策略新运行需要保存新的输入版本。','pool','股票池规则已保存',q.pool.join(' / ')||'空股票池');render()}
function newProject(){modal('新建研究项目','<label for="newName">项目名称</label><input id="newName" maxlength="60" placeholder="例如：低波动轮动研究">',btn('取消','closeDialog')+btn('创建项目','createProject','primary'));$('#newName').focus()}
function createNew(){const name=$('#newName').value.trim();if(!name)return toast('请输入项目名称');stopPlay();const q=createProject(projects.length+1);q.name=name;projects.push(q);projectId=q.id;$('#dialog').close();render()}
function showEvidence(){const q=p();modal('运行记录与任务控制',`<p class="note no-margin">只记录任务动作、依据和产物，不展示模型内部推理。所有任务均为离线演示。</p><pre class="code-pre">${esc(q.logs.join('\n')||'暂无任务记录')}</pre><div class="row">${btn('下次任务模拟失败','simulateFailure','small')}${q.retry?btn('重试上次任务','retryTask','small'):''}</div>`)}
const actions={confirmReq,generateDesign,saveDesign,generateCode,checkCode,saveVersion,runExperiment,makeReport,makePlan,checkPlan,exportPlan,confirmExport,updateData,savePool,explain,newProject,createProject:createNew,cancelTask,closeDialog:()=>$('#dialog').close(),
 downloadReq:()=>download('研究需求.md','# 研究需求（离线原型草稿）\n\n'+p().reqText+'\n\n## 验收标准\n\n'+p().acceptance),
 downloadDesign:()=>download('策略设计.md','# 策略设计（离线原型）\n\n'+p().designNote+'\n\n投入比例：'+p().designAllocation+'%；最低成交额：'+p().designAmount+'万元。'),
 downloadCode:()=>download('策略示例.py',p().code),
 exportExperiments:()=>download('研究实验-合成数据.json',JSON.stringify({kind:'离线原型合成实验，非生产验收',project:p().name,runs:p().runs},null,2),'application/json'),
 flowTab:()=>{p().diagram='flow';render()},sequenceTab:()=>{p().diagram='sequence';render()},
 showDiff:()=>{p().showDiff=true;render()},hideDiff:()=>{p().showDiff=false;render()},applyFix:()=>{p().code=source(true);p().checked=null;p().showDiff=false;tell('修复已应用到草稿。请检查并保存为新版本，再运行实验验证。','develop','修复后的策略草稿','尚未保存为版本');render()},
 debugFix:()=>{p().showDiff=true;go('develop')},
 nodeSource:()=>{const n=nodes.find(x=>x.id===p().selectedNode);go('develop');const el=$('#code'),lines=el.value.split('\n'),start=lines.slice(0,n.line-1).join('\n').length+(n.line>1?1:0);el.focus();el.setSelectionRange(start,start+lines[n.line-1].length);toast('已定位示例源码第 '+n.line+' 行')},
 rewind:()=>{stopPlay();const r=selectedRun(),e=eventsVisible()[0];p().eventIndex=e?r.events.indexOf(e):0;render()},step,
 play:()=>{if(playTimer)stopPlay();else playTimer=setInterval(step,700);render()},
 eventSource:()=>{const r=selectedRun(),e=r.events[p().eventIndex];modal('冻结源码 v'+r.version.id+' · 第 '+e.line+' 行',`<pre class="code-pre">${esc(r.version.source.split('\n').map((l,i)=>(i+1===e.line?'▶ ':'  ')+(i+1)+'  '+l).join('\n'))}</pre>`)},
 divergence:()=>{const d=firstDivergence();if(!d)return;p().runIndex=p().runs.indexOf(d.b);p().eventIndex=d.f?d.b.events.indexOf(d.f):0;p().nodeFilter='';go('debug')},
 simulateFailure:()=>{p().failNext=true;$('#dialog').close();toast('下次后台任务将模拟失败，可随后重试')},
 retryTask:()=>{const r=p().retry;if($('#dialog').open)$('#dialog').close();if(r)startTask(r.label,r.fn)},
};
function render(){const q=p();$('#projectSelect').innerHTML=projects.map(x=>`<option value="${x.id}" ${x.id===q.id?'selected':''}>${esc(x.name)}</option>`).join('');$('#projectName').textContent=q.name;
 const nav=(keys)=>keys.map(k=>`<button data-go="${k}" class="${q.page===k?'active':''}" ${q.page===k?'aria-current="page"':''} title="${routes[k][0]}">${icon(routes[k][1])}<span class="nav-label">${routes[k][0]}</span>${k==='experiments'?'<span class="count">'+q.runs.length+'</span>':''}</button>`).join('');$('#nav').innerHTML=nav(mainRoutes);$('#resourceNav').innerHTML=nav(resourceRoutes);
 $('#versionTag').textContent='R'+(q.req?.id||'—')+' / D'+(q.design?.id||'—')+' / v'+(q.active||'—');
 $('#canvas').innerHTML=draftNotice(q)+({overview,requirements,design,develop,debug,experiments,validate,plan,data:dataView,pool:poolView,library})[q.page]();
 $('#messages').innerHTML='<div class="intro-line">项目对话 · 上下文与产物持续关联</div>'+q.messages.map(m=>`<article class="message ${m.role}"><div class="msg-meta">${m.role==='user'?'<span class="dot" style="background:#777"></span> 你':'<span style="color:#4ade80">✧</span> 研究助手'}</div><div class="msg-body">${esc(m.text)}</div>${m.card?`<button class="artifact-card" data-go="${m.card}">${icon(routes[m.card][1])}<span><b>${esc(m.title)}</b><small>${esc(m.desc)}</small></span>${icon('arrow')}</button>`:''}</article>`).join('');
 $('#chatInput').value=q.chatDraft;const suggestions=q.req?q.design?['生成策略代码','运行回测实验','生成验证报告']:['生成策略设计','解释验证区别']:['生成需求草稿','解释验证区别'];$('#suggestions').innerHTML=suggestions.map(t=>`<button data-prompt="${t}">${t}</button>`).join('');
 $('#taskSlot').innerHTML=q.task?`<div class="taskbar"><i class="task-spin"></i><span>${esc(q.task.label)}…</span>${btn('取消','cancelTask','small ghost')}</div>`:q.retry?`<div class="taskbar"><span>任务未完成 · 可重试</span>${btn('重试','retryTask','small ghost')}</div>`:'';
 $('#root').classList.toggle('focus',focus);$('#focusToggle').textContent=focus?'返回对话 ⤡':'展开工作区 ⤢';$('#focusToggle').setAttribute('aria-pressed',String(focus));
 history.replaceState(null,'','#'+q.page);const msg=$('#messages');msg.scrollTop=msg.scrollHeight;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-node],[data-version],[data-view-version],[data-req],[data-run],[data-manifest],[data-event],[data-filter],[data-prompt],[data-evidence-run],[data-stock]');if(!b||b.disabled)return;
 if(b.dataset.go)return go(b.dataset.go);
 if(b.dataset.act){const act=b.dataset.act;if(act.startsWith('go:'))return go(act.slice(3));return actions[act]?.()}
 if(b.dataset.prompt)return submitChat(b.dataset.prompt);
 if(b.dataset.node){p().selectedNode=b.dataset.node;return render()}
 if(b.dataset.version){p().active=+b.dataset.version;markChanged(p());render();return toast('已选择策略 v'+p().active)}
 if(b.dataset.viewVersion){const v=p().versions.find(x=>x.id===+b.dataset.viewVersion);return modal('只读策略 v'+v.id,`<pre class="code-pre">${esc(v.source)}</pre>`)}
 if(b.dataset.req){const r=p().reqs.find(x=>x.id===+b.dataset.req);return modal('只读需求 R'+r.id,`<pre class="code-pre">${esc(JSON.stringify(r,null,2))}</pre>`)}
 if(b.dataset.run!==undefined){p().runIndex=+b.dataset.run;p().eventIndex=0;p().nodeFilter='';return go('debug')}
 if(b.dataset.manifest!==undefined){const r=p().runs[+b.dataset.manifest];return modal('实验 E'+r.id+' 冻结输入',`<pre class="code-pre">${esc(JSON.stringify(r.version,null,2))}</pre>`)}
 if(b.dataset.event!==undefined){stopPlay();p().eventIndex=+b.dataset.event;return render()}
 if(b.dataset.filter!==undefined){stopPlay();p().nodeFilter=b.dataset.filter;const es=eventsVisible();p().eventIndex=es.length?selectedRun().events.indexOf(es[0]):-1;return render()}
 if(b.dataset.evidenceRun){p().runIndex=p().runs.findIndex(x=>x.id===+b.dataset.evidenceRun);p().eventIndex=0;p().nodeFilter='';return go('debug')}
 if(b.dataset.stock){const s=fixture.find(x=>x.symbol===b.dataset.stock);return modal(s.symbol+' · '+s.name,`<dl class="kv"><dt>市场</dt><dd>${s.market}</dd><dt>成交额</dt><dd>${s.amount} 万元</dd><dt>示例信号</dt><dd>${s.signal?'正向':'无信号'}</dd><dt>流动性条件</dt><dd>${s.amount>=p().poolAmount?'满足':'不满足'}当前阈值</dd></dl>`)}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-node],[data-event]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{const el=e.target,q=p();if(el.id==='chatInput'){q.chatDraft=el.value;return}if(el.dataset.field){q[el.dataset.field]=el.type==='number'?Number(el.value):el.value;if(el.dataset.field==='code'){q.checked=null;const save=$('[data-act="saveVersion"]');if(save)save.disabled=true;}return}
 let changed=false;if(el.dataset.plan){q.planInput[el.dataset.plan]=el.type==='number'?Number(el.value):el.value;changed=true}if(el.dataset.holding!==undefined){q.planInput.holdings[+el.dataset.holding]=Number(el.value);changed=true}if(el.dataset.sellable!==undefined){q.planInput.sellable[+el.dataset.sellable]=Number(el.value);changed=true}if(changed&&q.plan){q.plan.checked=false;const b=$('[data-act="exportPlan"]');if(b)b.disabled=true;const status=$('#planCheckStatus');if(status)status.innerHTML=badge('输入已变化，请重新生成并核对','warn');}
 if(el.id==='poolSearch'){q.poolSearch=el.value;const start=el.selectionStart;render();$('#poolSearch').focus();$('#poolSearch').setSelectionRange(start,start)}
});
document.addEventListener('change',e=>{if(e.target.id==='projectSelect'){stopPlay();projectId=+e.target.value;render()}if(e.target.id==='runSelect'){stopPlay();p().runIndex=+e.target.value;p().eventIndex=0;p().nodeFilter='';render()}if(e.target.id==='poolMarket'){p().poolMarket=e.target.value;render()}});
$('#chatForm').onsubmit=e=>{e.preventDefault();submitChat($('#chatInput').value)};$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submitChat(e.target.value)}};
$('#newProject').onclick=newProject;$('#showEvidence').onclick=showEvidence;$('#focusToggle').onclick=()=>{focus=!focus;render()};
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(routes[route]){stopPlay();p().page=route;render()}});
if(routes[location.hash.slice(1)])p().page=location.hash.slice(1);render();
</script>
</body>
</html>
