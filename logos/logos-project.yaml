project:
  name: nautilus_trader
  description: ''
  methodology: OpenLogos
tech_stack:
  language: Rust 1.98.1（rust-toolchain.toml 锁定）
  gui: egui/eframe + egui_plot（astock-desktop-launch 提案 L2~L4 落地；依赖获取策略见 3-deployment/core-03-desktop-delivery.md）
  metadata: SQLite（rusqlite 0.38 bundled，单写线程 + 只读连接，WAL）
  market_data: Parquet（arrow/parquet 59.3.0，workspace patches 兼容层）
  test: cargo test + nautilus-research-testkit OpenLogos reporter（JSONL → logos/resources/verify/test-results.jsonl）
  python_bridge: python/tests/adapters/astock（通达信/TickFlow 数据子进程，后续批次）
scenario_counter:
  next_id: 22
modules:
- id: core
  name: 核心功能
  lifecycle: launched
  bootstrap: adopted
  skip_phases:
  - api
  - database
  - scenario
  deployment_required: true
deployment_gates:
  core:
    deployment_required: true
    smoke_required: true
    environments:
    - staging
resource_index:
- path: logos/resources/prd/1-product-requirements/01-overview.md
  desc: 产品定位与价值主张。AI 在需要理解"产品是什么/解决什么问题/边界"时读取（引擎与库形态、A股桌面研究应用边界）
- path: logos/resources/prd/1-product-requirements/02-user-personas.md
  desc: 四类用户画像 P1-P4（研究员/量化开发者/自营团队/适配器贡献者）及反画像。AI 在做需求决策、优先级取舍、UX 判断时读取
- path: logos/resources/prd/1-product-requirements/03-user-stories.md
  desc: 用户故事 US-001~US-010 及验收条件。AI 在编写变更提案影响分析、测试用例、功能规格时读取
- path: logos/resources/prd/1-product-requirements/04-functional-requirements.md
  desc: 功能性需求 FR-001~FR-018（含优先级与仓库事实来源）。需求级变更的追踪锚点，任何功能变更提案必须对照更新
- path: logos/resources/prd/1-product-requirements/05-non-functional-requirements.md
  desc: 非功能性需求 NFR-001~NFR-012（性能/可靠性/兼容/安全/工程质量）。性能、安全、平台支持类变更提案必读
- path: logos/resources/prd/1-product-requirements/06-competitor-landscape.md
  desc: 竞品对比（Lean/Backtrader/Freqtrade 等）与差异化定位。产品定位类讨论与路线图决策时读取
- path: logos/resources/prd/2-product-design/1-feature-specs/01-information-architecture.md
  desc: 信息架构：能力域↔crate↔Python包↔需求追踪矩阵、节点类型、引擎组件协议、适配器规格。理解产品功能组成时读取
- path: logos/resources/prd/2-product-design/2-page-design/01-no-gui-design-decision.md
  desc: ADR：引擎保持无 GUI；A股桌面研究应用使用独立 Rust GUI 页面设计
- path: logos/resources/prd/3-technical-plan/1-architecture/01-architecture-overview.md
